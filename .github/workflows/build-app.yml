          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M8,5v14l11,-7z" />
          </vector>
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'BTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/res/values/colors.xml')"
          cat > 'android/app/src/main/res/values/colors.xml' <<'BTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_bg">#FF5A36</color>
          </resources>
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/res/values/strings.xml')"
          cat > 'android/app/src/main/res/values/strings.xml' <<'BTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">BraveTube</string>
          </resources>
          BTEOF
          mkdir -p "$(dirname 'android/build.gradle')"
          cat > 'android/build.gradle' <<'BTEOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          BTEOF
          mkdir -p "$(dirname 'android/gradle.properties')"
          cat > 'android/gradle.properties' <<'BTEOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          BTEOF
          mkdir -p "$(dirname 'android/settings.gradle')"
          cat > 'android/settings.gradle' <<'BTEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BraveTube"
          include ':app'
          BTEOF

      - name: Gradle laden
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: APK bauen
        env:
          BT_BUILD: ${{ github.run_number }}
          BT_KEYSTORE: ${{ github.workspace }}/app-signing/bravetube.jks
        run: |
          cd android
          gradle --no-daemon --console=plain assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../BraveTube.apk
          ls -la ../BraveTube.apk

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ github.run_number }}" BraveTube.apk --latest \
            --title "BraveTube App (Build ${{ github.run_number }})" \
            --notes "Auf dem Handy in Brave öffnen und installieren: https://github.com/${{ github.repository }}/releases/latest/download/BraveTube.apk"
