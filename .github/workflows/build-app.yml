          package com.foxysoxy.bravetube;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.graphics.drawable.Icon;
          import android.os.IBinder;
          import android.os.PowerManager;

          /** Hält die App am Leben, solange im Hintergrund Ton läuft. */
          public class MediaService extends Service {
              private static final String CHANNEL = "playback";
              private PowerManager.WakeLock wake;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (nm != null) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Wiedergabe", NotificationManager.IMPORTANCE_LOW);
                      ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                  }
                  Intent open = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  PendingIntent toggle = PendingIntent.getBroadcast(this, 2,
                          new Intent(MainActivity.ACTION_TOGGLE).setPackage(getPackageName()),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Action act = new Notification.Action.Builder(
                          Icon.createWithResource(this, R.drawable.ic_pause), "Pause / Weiter", toggle).build();
                  if (wake == null) {
                      PowerManager pm = getSystemService(PowerManager.class);
                      if (pm != null) {
                          wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "BraveTube:play");
                          wake.setReferenceCounted(false);
                          wake.acquire(4 * 60 * 60 * 1000L);
                      }
                  }
                  Notification n = new Notification.Builder(this, CHANNEL)
                          .addAction(act)
                          .setSmallIcon(R.drawable.ic_play)
                          .setContentTitle("BraveTube")
                          .setContentText("Wiedergabe läuft im Hintergrund")
                          .setOngoing(true)
                          .setContentIntent(pi)
                          .build();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(1, n);
                  }
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (wake != null && wake.isHeld()) wake.release();
                  wake = null;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
