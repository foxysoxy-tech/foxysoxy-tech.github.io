          mkdir -p "$(dirname 'android/app/src/main/java/com/foxysoxy/bravetube/YtFetcher.java')"
          cat > 'android/app/src/main/java/com/foxysoxy/bravetube/YtFetcher.java' <<'BTEOF'
          package com.foxysoxy.bravetube;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.HashSet;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Lädt YouTube-Seiten mit den Cookies des angemeldeten Kontos und liest Videos und Playlists aus ytInitialData. */
          final class YtFetcher {
              private YtFetcher() {}

              static final String UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
              private static final Pattern PLAYLIST_ID = Pattern.compile("^[A-Za-z0-9_-]{2,64}$");
              private static final Pattern DURATION = Pattern.compile("\"text\":\"(\\d{1,2}(?::\\d{2}){1,2})\"");
              private static final String[] VIDEO_KEYS = {
                      "videoRenderer", "playlistVideoRenderer", "compactVideoRenderer", "gridVideoRenderer",
                      "videoWithContextRenderer", "playlistPanelVideoRenderer"};
              private static final String[] PLAYLIST_KEYS = {"gridPlaylistRenderer", "playlistRenderer", "compactPlaylistRenderer"};

              static JSONObject fetch(String kind, String arg, String cookie) {
                  try {
                      String url;
                      switch (kind) {
                          case "home": url = "https://www.youtube.com/"; break;
                          case "more": return fetchMore(arg, cookie);
                          case "history": url = "https://www.youtube.com/feed/history"; break;
                          case "wl": url = "https://www.youtube.com/playlist?list=WL"; break;
                          case "playlists": url = "https://www.youtube.com/feed/playlists"; break;
                          case "playlist":
                              if (arg == null || !PLAYLIST_ID.matcher(arg).matches()) return error("Ungültige Playlist");
                              url = "https://www.youtube.com/playlist?list=" + arg;
                              break;
                          default: return error("Unbekannte Anfrage");
                      }
                      if (cookie == null || !cookie.contains("SAPISID=")) return error("login");

                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setInstanceFollowRedirects(true);
                      c.setRequestProperty("User-Agent", UA);
                      c.setRequestProperty("Accept", "text/html,application/xhtml+xml");
                      c.setRequestProperty("Accept-Language", "de-DE,de;q=0.9,en;q=0.5");
                      c.setRequestProperty("Cookie", cookie);
                      int code = c.getResponseCode();
                      String finalHost = c.getURL().getHost() == null ? "" : c.getURL().getHost();
                      if (code >= 400) return error("YouTube antwortet nicht (HTTP " + code + ")");
                      String html = readAll(c.getInputStream());
                      if (finalHost.contains("consent.youtube.com") || finalHost.contains("accounts.google.com")) return error("login");
                      if (html.contains("\"LOGGED_IN\":false")) return error("login");

                      JSONObject data = extractInitialData(html);
                      if (data == null) return error("YouTube-Seite konnte nicht gelesen werden");

                      JSONArray videos = new JSONArray();
                      JSONArray playlists = new JSONArray();
                      String[] next = new String[1];
                      walk(data, videos, playlists, new HashSet<>(), new HashSet<>(), 0, next);
                      remember(html);

                      JSONObject res = new JSONObject();
                      res.put("ok", true);
                      if (next[0] != null) res.put("next", next[0]);
                      res.put("videos", videos);
                      res.put("playlists", playlists);
                      res.put("at", System.currentTimeMillis());
                      return res;
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }

              // ---------- Weitere Videos nachladen (Fortsetzung) ----------
              private static volatile String apiKey = "";
              private static volatile String clientVersion = "";
              private static volatile String visitorData = "";

              private static String firstMatch(String html, String regex) {
                  Matcher m = Pattern.compile(regex).matcher(html);
                  return m.find() ? m.group(1) : "";
              }

              static void remember(String html) {
                  String k = firstMatch(html, "\"INNERTUBE_API_KEY\":\"([^\"]+)\"");
                  String v = firstMatch(html, "\"INNERTUBE_CONTEXT_CLIENT_VERSION\":\"([^\"]+)\"");
                  String d = firstMatch(html, "\"VISITOR_DATA\":\"([^\"]+)\"");
                  if (!k.isEmpty()) apiKey = k;
                  if (!v.isEmpty()) clientVersion = v;
                  if (!d.isEmpty()) visitorData = d;
              }

              private static String cookieValue(String cookie, String name) {
                  for (String part : cookie.split(";")) {
                      String p = part.trim();
                      if (p.startsWith(name + "=")) return p.substring(name.length() + 1);
                  }
                  return "";
              }

              static String sapisidHash(String cookie) throws Exception {
                  String sid = cookieValue(cookie, "SAPISID");
                  if (sid.isEmpty()) sid = cookieValue(cookie, "__Secure-3PAPISID");
                  if (sid.isEmpty()) return null;
                  long ts = System.currentTimeMillis() / 1000;
                  MessageDigest md = MessageDigest.getInstance("SHA-1");
                  byte[] h = md.digest((ts + " " + sid + " https://www.youtube.com").getBytes(StandardCharsets.UTF_8));
                  StringBuilder sb = new StringBuilder();
                  for (byte b : h) sb.append(String.format("%02x", b));
                  return "SAPISIDHASH " + ts + "_" + sb;
              }

              static JSONObject fetchMore(String token, String cookie) {
                  try {
                      if (token == null || token.length() < 10 || token.length() > 8000) return error("Ungültige Fortsetzung");
                      if (cookie == null || !cookie.contains("SAPISID=")) return error("login");
                      if (apiKey.isEmpty()) {
                          // Konfiguration von der Startseite holen
                          JSONObject first = fetch("home", "", cookie);
                          if (first.has("error") && apiKey.isEmpty()) return first;
                      }
                      if (apiKey.isEmpty()) return error("YouTube-Konfiguration nicht gefunden");

                      JSONObject client = new JSONObject();
                      client.put("clientName", "WEB");
                      client.put("clientVersion", clientVersion.isEmpty() ? "2.20250101.00.00" : clientVersion);
                      client.put("hl", "de");
                      client.put("gl", "DE");
                      if (!visitorData.isEmpty()) client.put("visitorData", visitorData);
                      JSONObject context = new JSONObject();
                      context.put("client", client);
                      JSONObject body = new JSONObject();
                      body.put("context", context);
                      body.put("continuation", token);

                      HttpURLConnection c = (HttpURLConnection) new URL("https://www.youtube.com/youtubei/v1/browse?prettyPrint=false&key=" + apiKey).openConnection();
                      c.setRequestMethod("POST");
                      c.setDoOutput(true);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setRequestProperty("User-Agent", UA);
                      c.setRequestProperty("Content-Type", "application/json");
                      c.setRequestProperty("Accept-Language", "de-DE,de;q=0.9,en;q=0.5");
                      c.setRequestProperty("Origin", "https://www.youtube.com");
                      c.setRequestProperty("X-Origin", "https://www.youtube.com");
                      c.setRequestProperty("X-Goog-AuthUser", "0");
                      c.setRequestProperty("X-Youtube-Client-Name", "1");
                      c.setRequestProperty("X-Youtube-Client-Version", clientVersion);
                      if (!visitorData.isEmpty()) c.setRequestProperty("X-Goog-Visitor-Id", visitorData);
                      c.setRequestProperty("Cookie", cookie);
                      String auth = sapisidHash(cookie);
                      if (auth != null) c.setRequestProperty("Authorization", auth);
                      c.getOutputStream().write(body.toString().getBytes(StandardCharsets.UTF_8));
                      int code = c.getResponseCode();
                      if (code >= 400) return error("YouTube antwortet nicht (HTTP " + code + ")");
                      JSONObject data = new JSONObject(readAll(c.getInputStream()));

                      JSONArray videos = new JSONArray();
                      JSONArray playlists = new JSONArray();
                      String[] next = new String[1];
                      walk(data, videos, playlists, new HashSet<>(), new HashSet<>(), 0, next);
                      JSONObject res = new JSONObject();
                      res.put("ok", true);
                      res.put("videos", videos);
                      res.put("playlists", playlists);
                      if (next[0] != null) res.put("next", next[0]);
                      res.put("at", System.currentTimeMillis());
                      return res;
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }

              static String readAll(InputStream in) throws Exception {
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8))) {
                      StringBuilder sb = new StringBuilder(1 << 20);
                      char[] buf = new char[16384];
                      int n;
                      while ((n = r.read(buf)) > 0) sb.append(buf, 0, n);
                      return sb.toString();
                  }
              }

              static JSONObject extractInitialData(String html) {
                  int i = html.indexOf("var ytInitialData = ");
                  if (i < 0) i = html.indexOf("window[\"ytInitialData\"] = ");
                  if (i < 0) i = html.indexOf("ytInitialData = ");
                  if (i < 0) return null;
                  int start = html.indexOf('{', i);
                  if (start < 0) return null;
                  int end = html.indexOf(";</script>", start);
                  if (end < 0) return null;
                  try {
                      return new JSONObject(html.substring(start, end));
                  } catch (Exception e) {
                      return null;
                  }
              }

              private static JSONObject error(String msg) {
                  JSONObject o = new JSONObject();
                  try { o.put("error", msg); } catch (Exception ignored) {}
                  return o;
              }

              static String text(Object t) {
                  if (t == null) return "";
                  if (t instanceof String) return (String) t;
                  if (t instanceof JSONObject) {
                      JSONObject o = (JSONObject) t;
                      if (o.has("simpleText")) return o.optString("simpleText", "");
                      if (o.has("content") && o.opt("content") instanceof String) return o.optString("content", "");
                      JSONArray runs = o.optJSONArray("runs");
                      if (runs != null) {
                          StringBuilder sb = new StringBuilder();
                          for (int k = 0; k < runs.length(); k++) {
                              JSONObject r = runs.optJSONObject(k);
                              if (r != null) sb.append(r.optString("text", ""));
                          }
                          return sb.toString();
                      }
                  }
                  return "";
              }

              static long durToSec(String s) {
                  if (s == null || s.isEmpty()) return 0;
                  long total = 0;
                  for (String p : s.trim().split(":")) {
                      try { total = total * 60 + Long.parseLong(p.trim()); } catch (NumberFormatException e) { return 0; }
                  }
                  return total;
              }

              private static void addVideo(JSONArray videos, HashSet<String> seen, String id, String title, String channel,
                                           long dur, String views, String when) throws Exception {
                  if (id == null || id.isEmpty() || seen.contains(id)) return;
                  seen.add(id);
                  JSONObject v = new JSONObject();
                  v.put("id", id);
                  v.put("title", title);
                  v.put("channel", channel);
                  v.put("dur", dur);
                  v.put("views", views);
                  v.put("when", when);
                  videos.put(v);
              }

              private static void addPlaylist(JSONArray playlists, HashSet<String> seen, String id, String title, String info) throws Exception {
                  if (id == null || id.isEmpty() || seen.contains(id)) return;
                  seen.add(id);
                  JSONObject p = new JSONObject();
                  p.put("id", id);
                  p.put("title", title);
                  p.put("info", info);
                  playlists.put(p);
              }

              private static void walk(Object o, JSONArray videos, JSONArray playlists, HashSet<String> seenV,
                                       HashSet<String> seenP, int depth, String[] next) throws Exception {
                  if (o == null || depth > 120) return;
                  if (o instanceof JSONArray) {
                      JSONArray a = (JSONArray) o;
                      for (int i = 0; i < a.length(); i++) walk(a.opt(i), videos, playlists, seenV, seenP, depth + 1, next);
                      return;
                  }
                  if (!(o instanceof JSONObject)) return;
                  JSONObject obj = (JSONObject) o;

                  for (String key : VIDEO_KEYS) {
                      JSONObject vr = obj.optJSONObject(key);
                      if (vr == null || !vr.has("videoId")) continue;
                      String title = text(vr.opt("title"));
                      if (title.isEmpty()) title = text(vr.opt("headline"));
                      String channel = text(vr.opt("ownerText"));
                      if (channel.isEmpty()) channel = text(vr.opt("shortBylineText"));
                      if (channel.isEmpty()) channel = text(vr.opt("longBylineText"));
                      long dur = vr.has("lengthSeconds") ? vr.optLong("lengthSeconds", 0) : durToSec(text(vr.opt("lengthText")));
                      String views = text(vr.opt("viewCountText"));
                      if (views.isEmpty()) views = text(vr.opt("shortViewCountText"));
                      addVideo(videos, seenV, vr.optString("videoId", ""), title, channel, dur, views, text(vr.opt("publishedTimeText")));
                  }

                  JSONObject l = obj.optJSONObject("lockupViewModel");
                  if (l != null && l.has("contentId")) {
                      String type = l.optString("contentType", "");
                      String id = l.optString("contentId", "");
                      JSONObject md = l.optJSONObject("metadata");
                      JSONObject lm = md == null ? null : md.optJSONObject("lockupMetadataViewModel");
                      String title = lm == null ? "" : text(lm.opt("title"));
                      String channel = "", views = "", when = "";
                      if (lm != null) {
                          JSONObject m2 = lm.optJSONObject("metadata");
                          JSONObject cm = m2 == null ? null : m2.optJSONObject("contentMetadataViewModel");
                          JSONArray rows = cm == null ? null : cm.optJSONArray("metadataRows");
                          if (rows != null) {
                              java.util.ArrayList<String> parts = new java.util.ArrayList<>();
                              for (int r = 0; r < rows.length(); r++) {
                                  JSONObject row = rows.optJSONObject(r);
                                  JSONArray mp = row == null ? null : row.optJSONArray("metadataParts");
                                  if (mp == null) continue;
                                  for (int k = 0; k < mp.length(); k++) {
                                      JSONObject part = mp.optJSONObject(k);
                                      if (part != null) parts.add(text(part.opt("text")));
                                  }
                              }
                              if (parts.size() > 0) channel = parts.get(0);
                              if (parts.size() > 1) views = parts.get(1);
                              if (parts.size() > 2) when = parts.get(2);
                          }
                      }
                      if (type.contains("VIDEO")) {
                          long dur = 0;
                          JSONObject img = l.optJSONObject("contentImage");
                          if (img != null) {
                              Matcher m = DURATION.matcher(img.toString());
                              if (m.find()) dur = durToSec(m.group(1));
                          }
                          addVideo(videos, seenV, id, title, channel, dur, views, when);
                      } else if (type.contains("PLAYLIST") || type.contains("PODCAST")) {
                          String info = channel + (views.isEmpty() ? "" : " · " + views);
                          addPlaylist(playlists, seenP, id, title, info);
                      }
                  }

                  for (String key : PLAYLIST_KEYS) {
                      JSONObject pr = obj.optJSONObject(key);
                      if (pr == null || !pr.has("playlistId")) continue;
                      String info = text(pr.opt("videoCountText"));
                      if (info.isEmpty()) info = text(pr.opt("videoCountShortText"));
                      addPlaylist(playlists, seenP, pr.optString("playlistId", ""), text(pr.opt("title")), info);
                  }

                  JSONObject cir = obj.optJSONObject("continuationItemRenderer");
                  if (cir != null) {
                      JSONObject ep = cir.optJSONObject("continuationEndpoint");
                      JSONObject cc = ep == null ? null : ep.optJSONObject("continuationCommand");
                      if (cc == null && ep != null) {
                          JSONArray cmds = null;
                          JSONObject ce = ep.optJSONObject("commandExecutorCommand");
                          if (ce != null) cmds = ce.optJSONArray("commands");
                          if (cmds != null) {
                              for (int q = 0; q < cmds.length(); q++) {
                                  JSONObject cmd = cmds.optJSONObject(q);
                                  if (cmd != null && cmd.optJSONObject("continuationCommand") != null) cc = cmd.optJSONObject("continuationCommand");
                              }
                          }
                      }
                      if (cc != null && !cc.optString("token", "").isEmpty()) next[0] = cc.optString("token");
                  }

                  java.util.Iterator<String> keys = obj.keys();
                  while (keys.hasNext()) {
                      String k = keys.next();
                      Object child = obj.opt(k);
                      if (child instanceof JSONObject || child instanceof JSONArray) walk(child, videos, playlists, seenV, seenP, depth + 1, next);
                  }
              }
          }
