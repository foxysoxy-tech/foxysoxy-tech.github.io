# BraveTube App – dieser Workflow baut die Android-App (APK) und legt sie als Release ab.
# Neu bauen: Actions → "BraveTube App bauen" → "Run workflow".
name: BraveTube App bauen

on:
  push:
    paths:
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Signierschlüssel anlegen (nur beim ersten Mal)
        run: |
          if [ ! -f app-signing/bravetube.jks ]; then
            mkdir -p app-signing
            keytool -genkeypair -v -keystore app-signing/bravetube.jks -storepass bravetube -keypass bravetube \
              -alias bravetube -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=BraveTube, O=BraveTube, C=BG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-signing/bravetube.jks
            git commit -m "App-Signierschlüssel für BraveTube"
            git push || (git pull --rebase && git push)
          fi

      - name: Projektdateien schreiben
        run: |
          mkdir -p "$(dirname 'android/app/build.gradle')"
          cat > 'android/app/build.gradle' <<'BTEOF'
          plugins { id 'com.android.application' }

          def buildNo = (System.getenv('BT_BUILD') ?: '1').toInteger()

          android {
              namespace 'com.foxysoxy.bravetube'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.foxysoxy.bravetube'
                  minSdk 26
                  targetSdk 35
                  versionCode buildNo
                  versionName "1.${buildNo}"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('BT_KEYSTORE') ?: '../../app-signing/bravetube.jks')
                      storePassword 'bravetube'
                      keyAlias 'bravetube'
                      keyPassword 'bravetube'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/AndroidManifest.xml')"
          cat > 'android/app/src/main/AndroidManifest.xml' <<'BTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-feature android:name="android.software.picture_in_picture" android:required="false" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".LoginActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden" />

                  <service
                      android:name=".MediaService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/assets/shim.js')"
          cat > 'android/app/src/main/assets/shim.js' <<'BTEOF'
          // Brücke zwischen der BraveTube-Seite und der App (läuft nur auf foxysoxy-tech.github.io)
          (function () {
            if (window.__btShim) return;
            window.__btShim = true;

            function native() { return window.BraveTubeNative; }

            function post(obj) {
              var n = native();
              if (!n) return false;
              try { n.postMessage(JSON.stringify(obj)); return true; } catch (e) { return false; }
            }

            function hook() {
              var n = native();
              if (!n || n.__btHooked) return;
              n.__btHooked = true;
              n.onmessage = function (e) {
                var m;
                try { m = JSON.parse(e.data); } catch (err) { return; }
                if (!m) return;
                if (m.id != null) window.postMessage({ bt: 'res', id: m.id, res: m.res }, '*');
                else if (m.event) window.postMessage({ bt: 'event', event: m.event, on: m.on }, '*');
              };
            }

            window.addEventListener('message', function (e) {
              var d = e.data;
              if (!d || typeof d !== 'object') return;
              if (d.bt === 'req') {
                if (d.kind === 'ping') { window.postMessage({ bt: 'res', id: d.id, res: { ok: true, v: 'app' } }, '*'); return; }
                hook();
                var ok = post({ id: d.id, kind: String(d.kind || ''), arg: d.arg == null ? '' : String(d.arg) });
                if (!ok) window.postMessage({ bt: 'res', id: d.id, res: { error: 'App-Brücke nicht verfügbar' } }, '*');
              } else if (d.bt === 'cmd') {
                hook();
                post(d);
              }
            });

            function hello() { hook(); window.postMessage({ bt: 'ready', v: 'app' }, '*'); }
            hello();
            document.addEventListener('DOMContentLoaded', hello);
            window.addEventListener('load', hello);
          })();
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/assets/visibility.js')"
          cat > 'android/app/src/main/assets/visibility.js' <<'BTEOF'
          // Läuft in YouTube-Frames: lässt den Player glauben, die Seite sei sichtbar,
          // damit die Wiedergabe im Hintergrund weiterläuft (wie "Hintergrundwiedergabe" in Brave).
          (function () {
            try {
              Object.defineProperty(document, 'hidden', { get: function () { return false; }, configurable: true });
              Object.defineProperty(document, 'visibilityState', { get: function () { return 'visible'; }, configurable: true });
              Object.defineProperty(document, 'webkitHidden', { get: function () { return false; }, configurable: true });
              Object.defineProperty(document, 'webkitVisibilityState', { get: function () { return 'visible'; }, configurable: true });
            } catch (e) { }
            var block = function (e) { e.stopImmediatePropagation(); };
            window.addEventListener('visibilitychange', block, true);
            document.addEventListener('visibilitychange', block, true);
            window.addEventListener('webkitvisibilitychange', block, true);
            document.addEventListener('webkitvisibilitychange', block, true);
          })();
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/java/com/foxysoxy/bravetube/Assets.java')"
          cat > 'android/app/src/main/java/com/foxysoxy/bravetube/Assets.java' <<'BTEOF'
          package com.foxysoxy.bravetube;

          import android.content.Context;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          final class Assets {
              private Assets() {}

              static String read(Context c, String name) {
                  try (InputStream in = c.getAssets().open(name)) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return new String(out.toByteArray(), StandardCharsets.UTF_8);
                  } catch (IOException e) {
                      return "";
                  }
              }
          }
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/java/com/foxysoxy/bravetube/LoginActivity.java')"
          cat > 'android/app/src/main/java/com/foxysoxy/bravetube/LoginActivity.java' <<'BTEOF'
          package com.foxysoxy.bravetube;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /** Einmalige Anmeldung bei YouTube. Die Cookies landen im gemeinsamen Cookie-Speicher der App. */
          public class LoginActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(0xFF111013);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setBackgroundColor(0xFF111013);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  int pad = (int) (12 * getResources().getDisplayMetrics().density);
                  bar.setPadding(pad, pad, pad, pad);

                  TextView title = new TextView(this);
                  title.setText("Bei YouTube anmelden");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(17);
                  title.setTypeface(null, Typeface.BOLD);
                  bar.addView(title, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button done = new Button(this);
                  done.setText("Fertig");
                  done.setOnClickListener(v -> finishWithResult());
                  bar.addView(done, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  col.addView(bar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  web = new WebView(this);
                  col.addView(web, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(col);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  // Google lehnt Anmeldungen in eingebetteten Ansichten ab; der Browser-Kennung werden deshalb die WebView-Merkmale genommen.
                  String ua = s.getUserAgentString().replace("; wv", "").replaceAll("Version/[\\d.]+ ", "");
                  s.setUserAgentString(ua);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (url != null && url.contains("youtube.com/") && !url.contains("accounts.") && !url.contains("consent.") && loggedIn()) {
                              finishWithResult();
                          }
                      }
                  });

                  web.loadUrl("https://accounts.google.com/ServiceLogin?service=youtube&hl=de&continue="
                          + Uri.encode("https://www.youtube.com/feed/history"));
              }

              static boolean loggedIn() {
                  String c = CookieManager.getInstance().getCookie("https://www.youtube.com");
                  return c != null && c.contains("SAPISID=");
              }

              private void finishWithResult() {
                  CookieManager.getInstance().flush();
                  setResult(loggedIn() ? RESULT_OK : RESULT_CANCELED);
                  finish();
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else finishWithResult();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/java/com/foxysoxy/bravetube/MainActivity.java')"
          cat > 'android/app/src/main/java/com/foxysoxy/bravetube/MainActivity.java' <<'BTEOF'
          package com.foxysoxy.bravetube;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.app.PictureInPictureParams;
          import android.app.RemoteAction;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.graphics.drawable.Icon;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Rational;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.webkit.JavaScriptReplyProxy;
          import androidx.webkit.WebMessageCompat;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              static final String HOST = "foxysoxy-tech.github.io";
              static final String SITE = "https://" + HOST + "/";
              static final String FALLBACK_PAGE = "BraveTube2.6.html";
              static final String API_LIST = "https://api.github.com/repos/foxysoxy-tech/foxysoxy-tech.github.io/contents/";
              static final String ACTION_TOGGLE = "com.foxysoxy.bravetube.TOGGLE";
              static final int REQ_LOGIN = 11;
              static final int RECEIVER_NOT_EXPORTED_FLAG = 4;

              private FrameLayout root;
              private WebView web;
              private View fullscreenView;
              private WebChromeClient.CustomViewCallback fullscreenCallback;
              private WebChromeClient chrome;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private final ExecutorService bg = Executors.newSingleThreadExecutor();
              private JavaScriptReplyProxy proxy;
              private boolean playing, audioOnly, inPip, bridgeOk, startScriptOk;
              private BroadcastReceiver pipReceiver;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(0xFF111013);
                  getWindow().setNavigationBarColor(0xFF1C1A1F);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF111013);
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);
                  setupWeb();

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 7);
                  }

                  pipReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          sendEvent("toggle", null);
                      }
                  };
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(pipReceiver, new IntentFilter(ACTION_TOGGLE), RECEIVER_NOT_EXPORTED_FLAG);
                  } else {
                      registerReceiver(pipReceiver, new IntentFilter(ACTION_TOGGLE));
                  }

                  loadStart();
              }

              private void setupWeb() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.setBackgroundColor(0xFF111013);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  // Damit der eingebettete Player das angemeldete Konto sieht und Videos im YouTube-Verlauf landen.
                  cm.setAcceptThirdPartyCookies(web, true);

                  HashSet<String> site = new HashSet<>(Arrays.asList("https://" + HOST));
                  HashSet<String> yt = new HashSet<>(Arrays.asList("https://*.youtube.com", "https://*.youtube-nocookie.com"));

                  if (WebViewFeature.isFeatureSupported(WebViewFeature.WEB_MESSAGE_LISTENER)) {
                      WebViewCompat.addWebMessageListener(web, "BraveTubeNative", site, this::onBridgeMessage);
                      bridgeOk = true;
                  }
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      startScriptOk = true;
                      WebViewCompat.addDocumentStartJavaScript(web, Assets.read(this, "visibility.js"), yt);
                      if (bridgeOk) WebViewCompat.addDocumentStartJavaScript(web, Assets.read(this, "shim.js"), site);
                  }
                  if (!bridgeOk) {
                      toast("Bitte „Android System WebView“ im Play Store aktualisieren, damit Verlauf und Listen laden.");
                  }

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) return false;
                          Uri u = request.getUrl();
                          String h = u.getHost();
                          if (h != null && h.equalsIgnoreCase(HOST)) return false;
                          openExternal(u.toString());
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (bridgeOk && !startScriptOk && url != null && url.startsWith(SITE)) {
                              view.evaluateJavascript(Assets.read(MainActivity.this, "shim.js"), null);
                          }
                      }
                  });

                  chrome = new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (fullscreenView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          fullscreenView = view;
                          fullscreenCallback = callback;
                          root.addView(view, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          web.setVisibility(View.GONE);
                          getWindow().getDecorView().setSystemUiVisibility(
                                  View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (fullscreenView == null) return;
                          root.removeView(fullscreenView);
                          fullscreenView = null;
                          web.setVisibility(View.VISIBLE);
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                          if (fullscreenCallback != null) {
                              fullscreenCallback.onCustomViewHidden();
                              fullscreenCallback = null;
                          }
                      }
                  };
                  web.setWebChromeClient(chrome);
              }

              // ---------- Start: neueste BraveTubeX.Y.html aus dem Repository ----------

              private void loadStart() {
                  final SharedPreferences prefs = getSharedPreferences("bt", MODE_PRIVATE);
                  final String last = prefs.getString("url", SITE + FALLBACK_PAGE);
                  web.loadUrl(last);
                  bg.execute(() -> {
                      final String best = findNewest();
                      if (best != null && !best.equals(last)) {
                          prefs.edit().putString("url", best).apply();
                          ui.post(() -> web.loadUrl(best));
                      }
                  });
              }

              private String findNewest() {
                  try {
                      HttpURLConnection c = (HttpURLConnection) new URL(API_LIST).openConnection();
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      c.setRequestProperty("Accept", "application/vnd.github+json");
                      c.setRequestProperty("User-Agent", "BraveTube-App");
                      if (c.getResponseCode() != 200) return null;
                      JSONArray a = new JSONArray(YtFetcher.readAll(c.getInputStream()));
                      Pattern pat = Pattern.compile("^BraveTube(\\d+)(?:\\.(\\d+))?\\.html$");
                      String bestName = null;
                      long bestScore = -1;
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject f = a.optJSONObject(i);
                          if (f == null) continue;
                          Matcher m = pat.matcher(f.optString("name", ""));
                          if (!m.matches()) continue;
                          long score = Long.parseLong(m.group(1)) * 100000L + (m.group(2) != null ? Long.parseLong(m.group(2)) : 0);
                          if (score > bestScore) {
                              bestScore = score;
                              bestName = f.optString("name", "");
                          }
                      }
                      return bestName == null ? null : SITE + bestName;
                  } catch (Exception e) {
                      return null;
                  }
              }

              // ---------- Brücke zur Seite ----------

              private void onBridgeMessage(WebView view, WebMessageCompat message, Uri sourceOrigin, boolean isMainFrame, JavaScriptReplyProxy replyProxy) {
                  if (!isMainFrame) return;
                  proxy = replyProxy;
                  String data = message.getData();
                  if (data == null) return;
                  try {
                      JSONObject m = new JSONObject(data);
                      if (m.has("cmd")) {
                          handleCmd(m);
                          return;
                      }
                      final int id = m.getInt("id");
                      final String kind = m.optString("kind", "");
                      final String arg = m.optString("arg", "");
                      final String cookie = CookieManager.getInstance().getCookie("https://www.youtube.com");
                      bg.execute(() -> reply(id, YtFetcher.fetch(kind, arg, cookie)));
                  } catch (Exception ignored) {
                  }
              }

              private void handleCmd(JSONObject m) {
                  String cmd = m.optString("cmd", "");
                  switch (cmd) {
                      case "login":
                          startActivityForResult(new Intent(this, LoginActivity.class), REQ_LOGIN);
                          break;
                      case "pip":
                          enterPip(true);
                          break;
                      case "state":
                          playing = m.optBoolean("playing", false);
                          audioOnly = m.optBoolean("audio", false);
                          applyState();
                          if (playing && !hasWindowFocus()) startBackground();
                          break;
                      case "open":
                          openExternal(m.optString("url", ""));
                          break;
                      default:
                          break;
                  }
              }

              private void reply(final int id, final JSONObject res) {
                  ui.post(() -> {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("id", id);
                          o.put("res", res);
                          if (proxy != null) proxy.postMessage(o.toString());
                      } catch (Exception ignored) {
                      }
                  });
              }

              private void sendEvent(final String event, final Boolean on) {
                  ui.post(() -> {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("event", event);
                          if (on != null) o.put("on", on.booleanValue());
                          if (proxy != null) {
                              proxy.postMessage(o.toString());
                          } else {
                              web.evaluateJavascript("window.postMessage({bt:'event',event:" + JSONObject.quote(event)
                                      + ",on:" + (on != null && on) + "},'*')", null);
                          }
                      } catch (Exception ignored) {
                      }
                  });
              }

              private void applyState() {
                  if (playing && !audioOnly) {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  } else {
                      getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  }
                  try { setPictureInPictureParams(pipParams()); } catch (Exception ignored) { }
              }

              // ---------- Mini-Fenster (Bild-in-Bild) ----------

              private PictureInPictureParams pipParams() {
                  List<RemoteAction> actions = new ArrayList<>();
                  Intent i = new Intent(ACTION_TOGGLE).setPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getBroadcast(this, 1, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  String label = playing ? "Pause" : "Weiter";
                  actions.add(new RemoteAction(Icon.createWithResource(this, playing ? R.drawable.ic_pause : R.drawable.ic_play), label, label, pi));
                  PictureInPictureParams.Builder b = new PictureInPictureParams.Builder().setAspectRatio(new Rational(16, 9)).setActions(actions);
                  if (Build.VERSION.SDK_INT >= 31) {
                      // Android 12+: Mini-Fenster öffnet sich von selbst beim Verlassen der App, solange ein Video läuft.
                      try {
                          boolean auto = playing && !audioOnly && fullscreenView == null;
                          PictureInPictureParams.Builder.class.getMethod("setAutoEnterEnabled", boolean.class).invoke(b, auto);
                          PictureInPictureParams.Builder.class.getMethod("setSeamlessResizeEnabled", boolean.class).invoke(b, false);
                      } catch (Exception ignored) { }
                  }
                  return b.build();
              }

              private void enterPip(boolean announce) {
                  if (!getPackageManager().hasSystemFeature(PackageManager.FEATURE_PICTURE_IN_PICTURE)) {
                      if (announce) toast("Dieses Gerät unterstützt kein Mini-Fenster.");
                      return;
                  }
                  try {
                      enterPictureInPictureMode(pipParams());
                  } catch (Exception e) {
                      if (announce) toast("Mini-Fenster nicht möglich. Android-Einstellungen → Apps → BraveTube → „Bild-im-Bild“ erlauben.");
                  }
              }

              @Override
              public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig);
                  inPip = isInPictureInPictureMode;
                  sendEvent("pip", isInPictureInPictureMode);
              }

              @Override
              protected void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if (playing && !audioOnly && fullscreenView == null && !inPip) enterPip(false);
              }

              // ---------- Hintergrund ----------

              private final Runnable keepAlive = new Runnable() {
                  @Override
                  public void run() {
                      if (web == null || !playing) return;
                      // Die Seite soll auch bei verdecktem Fenster weiterlaufen (Ton und Video).
                      try { web.onResume(); web.resumeTimers(); } catch (Exception ignored) { }
                      ui.postDelayed(this, 1500);
                  }
              };

              private void startBackground() {
                  if (!playing) return;
                  try { startForegroundService(new Intent(this, MediaService.class)); } catch (Exception ignored) { }
                  ui.removeCallbacks(keepAlive);
                  ui.postDelayed(keepAlive, 300);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  startBackground();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  startBackground();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  ui.removeCallbacks(keepAlive);
                  try { web.onResume(); } catch (Exception ignored) { }
                  stopService(new Intent(this, MediaService.class));
              }

              // ---------- Sonstiges ----------

              private void openExternal(String url) {
                  if (url == null || !(url.startsWith("https://") || url.startsWith("http://"))) return;
                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(new Intent(i).setPackage("com.brave.browser"));
                      return;
                  } catch (Exception ignored) {
                  }
                  try {
                      startActivity(i);
                  } catch (Exception e) {
                      toast("Kein Browser gefunden.");
                  }
              }

              private void toast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_LOGIN) {
                      CookieManager.getInstance().flush();
                      sendEvent("login", resultCode == RESULT_OK);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (fullscreenView != null) {
                      chrome.onHideCustomView();
                      return;
                  }
                  if (web.canGoBack()) {
                      web.goBack();
                  } else if (playing) {
                      moveTaskToBack(true);
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  try { unregisterReceiver(pipReceiver); } catch (Exception ignored) { }
                  stopService(new Intent(this, MediaService.class));
                  bg.shutdown();
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
