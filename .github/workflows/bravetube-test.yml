# BraveTube: bauen, im Android-Emulator testen, erst nach bestandenem Test veröffentlichen.
name: BraveTube testen und bauen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bravetube-test.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
      - name: Quelltexte aus build-app.yml übernehmen
        run: |
          python3 - <<'PYX'
          import yaml
          y=yaml.safe_load(open('.github/workflows/build-app.yml',encoding='utf-8'))
          st=[s for s in y['jobs']['build']['steps'] if s.get('name')=='Projektdateien schreiben'][0]
          open('/tmp/write.sh','w',encoding='utf-8').write(st['run'])
          PYX
          bash /tmp/write.sh
      - name: Änderungen einspielen
        run: |
          cat > /tmp/patch.py <<'PYX'
          import re,sys
          p='android/app/src/main/java/com/foxysoxy/bravetube/MainActivity.java'
          s=open(p,encoding='utf-8').read()

          # 1) Dateien mit Bild+Ton in einer Datei (itag 18, 22 ...) laden ohne Proxy direkt
          a='&& !NativeAudio.streamUa.isEmpty() && (ref == null'
          b='&& !NativeAudio.streamUa.isEmpty() && !isMuxedItag(u.getQueryParameter("itag")) && (ref == null'
          if 'isMuxedItag' not in s:
              assert s.count(a)==1, 'Stelle 1 nicht gefunden'
              s=s.replace(a,b)
              i=s.rstrip().rfind('}')
              s=s[:i]+'''
              static boolean isMuxedItag(String t) {
                  return "18".equals(t) || "22".equals(t) || "37".equals(t) || "38".equals(t) || "59".equals(t);
              }
          }
          '''

          # 2) Selbsttest: nur mit Intent-Extra "selftest" (Emulator), sonst ohne Wirkung
          if 'selfTest(' not in s:
              k='        web.loadUrl(last);\n'
              assert s.count(k)==1, 'Stelle 2 nicht gefunden'
              s=s.replace(k,k+'        if (getIntent() != null && getIntent().getStringExtra("selftest") != null) selfTest(getIntent().getStringExtra("selftest"));\n')
              i=s.rstrip().rfind('}')
              s=s[:i]+'''
              private void jsLog(final String tag, final String js) {
                  ui.post(() -> web.evaluateJavascript(js, r -> android.util.Log.i("BTTEST", tag + ": " + r)));
              }

              private void selfTest(final String id) {
                  final String probe = "(function(){var v=document.getElementById('ownV');if(!v)return 'kein ownV';return JSON.stringify({t:v.currentTime,d:v.duration,rs:v.readyState,p:v.paused,e:(v.error?v.error.code+':'+(v.error.message||''):null),s:(v.currentSrc||'').slice(0,60),why:(document.getElementById('why')?document.getElementById('why').textContent.slice(0,200):'')})})()";
                  final String seek60 = "(function(){var v=document.getElementById('ownV');if(v&&v.duration>0){v.currentTime=v.duration*0.6}return 'seek60'})()";
                  final String seek10 = "(function(){var v=document.getElementById('ownV');if(v&&v.duration>0){v.currentTime=v.duration*0.1}return 'seek10'})()";
                  ui.postDelayed(() -> jsLog("start", "(function(){try{play({id:'" + id + "',title:'selftest'});return 'play ok'}catch(e){return 'play fehler '+e}})()"), 30000);
                  ui.postDelayed(() -> jsLog("t1", probe), 55000);
                  ui.postDelayed(() -> jsLog("seek1", seek60), 56000);
                  ui.postDelayed(() -> jsLog("t2", probe), 66000);
                  ui.postDelayed(() -> jsLog("seek2", seek10), 67000);
                  ui.postDelayed(() -> jsLog("t3", probe), 77000);
                  ui.postDelayed(() -> android.util.Log.i("BTTEST", "ende"), 78000);
              }
          }
          '''
          open(p,'w',encoding='utf-8').write(s)
          print('MainActivity gepatcht')
          PYX
          python3 /tmp/patch.py
      - name: Gradle laden
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: APK bauen
        env:
          BT_KEYSTORE: ${{ github.workspace }}/app-signing/bravetube.jks
        run: |
          export BT_BUILD=$((GITHUB_RUN_NUMBER+100))
          echo "$BT_BUILD" > BraveTube-Build.txt
          cd android
          gradle --no-daemon --console=plain assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../BraveTube.apk
          ls -la ../BraveTube.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            BraveTube.apk
            BraveTube-Build.txt

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator starten und App testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r BraveTube.apk
            adb logcat -c
            adb shell am start -n com.foxysoxy.bravetube/.MainActivity --es selftest p3ug4IRm_ic
            sleep 100
            adb logcat -d -s BTTEST:I -v brief > bttest.log
            adb logcat -d -v brief > alllog.txt
      - name: Ergebnis auswerten
        run: |
          cat > check.py <<'PYX'
          import json,re,sys
          raw=open('bttest.log',encoding='utf-8',errors='replace').read()
          def get(tag):
              m=re.findall(r'BTTEST: '+tag+r': (.*)',raw)
              if not m: return None
              v=m[-1].strip()
              try:
                  v=json.loads(v)
                  if isinstance(v,str):
                      try: v=json.loads(v)
                      except Exception: pass
              except Exception: pass
              return v
          t1,t2,t3=get('t1'),get('t2'),get('t3')
          out=['## Emulator-Test (echtes Android, Video p3ug4IRm_ic)','','start: %s'%get('start'),'t1 (nach ~25 s Wiedergabe): %s'%t1,'t2 (nach Spulen auf 60 %%): %s'%t2,'t3 (nach Spulen auf 10 %%): %s'%t3,'']
          ok=True
          def need(c,msg):
              global ok
              out.append(('OK     ' if c else 'FEHLER ')+msg)
              if not c: ok=False
          need(isinstance(t1,dict) and (t1.get('t') or 0)>2 and not t1.get('p') and not t1.get('e'),'Video startet und läuft')
          need(isinstance(t2,dict) and t2.get('d') and t2['t']>=t2['d']*0.55 and t2['rs']>=3 and not t2.get('e'),'Vorspulen funktioniert')
          need(isinstance(t3,dict) and t3.get('d') and t3['d']*0.08<=t3['t']<=t3['d']*0.1+30 and t3['rs']>=3 and not t3.get('e'),'Zurückspulen funktioniert')
          out.append('')
          out.append('--- Log ---')
          out.append(raw[-6000:])
          txt='\n'.join(out)
          print(txt)
          open(__import__('os').environ.get('GITHUB_STEP_SUMMARY','/dev/null'),'a').write(txt+'\n')
          sys.exit(0 if ok else 1)
          PYX
          python3 check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-log
          path: |
            bttest.log
            alllog.txt

  veroeffentlichen:
    needs: emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: APK ablegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BraveTube.apk BraveTube-Build.txt
          git commit -m "BraveTube.apk (getestet, Build $(cat BraveTube-Build.txt))" || true
          git push || (git pull --rebase && git push)
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(cat BraveTube-Build.txt)
          gh release create "app-v$N" BraveTube.apk --latest --title "BraveTube App (Build $N, im Emulator getestet)" \
            --notes "Im Android-Emulator getestet: Abspielen, Vorspulen, Zurückspulen. Installieren: https://github.com/${{ github.repository }}/releases/latest/download/BraveTube.apk"
