# BraveTube: bauen, im Android-Emulator testen, erst nach bestandenem Test veröffentlichen.
name: BraveTube testen und bauen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bravetube-test.yml'
      - '.github/bt/**'

concurrency:
  group: bt-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
      - name: Quelltexte aus build-app.yml übernehmen
        run: |
          python3 - <<'PYX'
          import yaml
          y=yaml.safe_load(open('.github/workflows/build-app.yml',encoding='utf-8'))
          st=[s for s in y['jobs']['build']['steps'] if s.get('name')=='Projektdateien schreiben'][0]
          open('/tmp/write.sh','w',encoding='utf-8').write(st['run'])
          PYX
          bash /tmp/write.sh
      - name: Änderungen einspielen
        run: python3 .github/bt/patch.py
      - name: Gradle laden
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: APK bauen
        env:
          BT_KEYSTORE: ${{ github.workspace }}/app-signing/bravetube.jks
        run: |
          export BT_BUILD=$((GITHUB_RUN_NUMBER+100))
          echo "$BT_BUILD" > BraveTube-Build.txt
          cd android
          gradle --no-daemon --console=plain assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../BraveTube.apk
          ls -la ../BraveTube.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            BraveTube.apk
            BraveTube-Build.txt

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Test-Server starten (verhält sich wie der YouTube-Videoserver)
        run: bash .github/bt/server.sh
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator starten und App testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          script: bash .github/bt/emu.sh
      - name: Ergebnis auswerten
        run: |
          echo "--- Test-Server ---" ; tail -40 mock.out
          python3 .github/bt/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-log
          path: |
            bttest.log
            bttest2.log
            alllog.txt
            mock.out

  veroeffentlichen:
    if: false
    needs: emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: APK ablegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BraveTube.apk BraveTube-Build.txt
          git commit -m "BraveTube.apk (getestet, Build $(cat BraveTube-Build.txt))" || true
          git push || (git pull --rebase && git push)
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(cat BraveTube-Build.txt)
          gh release create "app-v$N" BraveTube.apk --latest --title "BraveTube App (Build $N, im Emulator getestet)" \
            --notes "Im Android-Emulator getestet: Abspielen, Vorspulen, Zurückspulen. Installieren: https://github.com/${{ github.repository }}/releases/latest/download/BraveTube.apk"
