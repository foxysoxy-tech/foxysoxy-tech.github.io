              static String readAll(InputStream in) throws Exception {
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8))) {
                      StringBuilder sb = new StringBuilder(1 << 20);
                      char[] buf = new char[16384];
                      int n;
                      while ((n = r.read(buf)) > 0) sb.append(buf, 0, n);
                      return sb.toString();
                  }
              }

              static JSONObject extractInitialData(String html) {
                  int i = html.indexOf("var ytInitialData = ");
                  if (i < 0) i = html.indexOf("window[\"ytInitialData\"] = ");
                  if (i < 0) i = html.indexOf("ytInitialData = ");
                  if (i < 0) return null;
                  int start = html.indexOf('{', i);
                  if (start < 0) return null;
                  int end = html.indexOf(";</script>", start);
                  if (end < 0) return null;
                  try {
                      return new JSONObject(html.substring(start, end));
                  } catch (Exception e) {
                      return null;
                  }
              }


              // ---------- Verlauf: Wiedergabe an YouTube melden, Eintrag bei YouTube löschen ----------
              private static final Pattern FB_TOKEN = Pattern.compile("\"feedbackToken\":\"([^\"]+)\"");
              private static final Pattern HIST_WORD = Pattern.compile("(?i)verlauf|history");
              private static final Pattern VID = Pattern.compile("^[A-Za-z0-9_-]{11}$");

              /** Sucht im Eintrag den Menüpunkt „Aus dem Wiedergabeverlauf entfernen“ und gibt dessen Token zurück. */
              private static String histToken(Object o, int depth) {
                  if (o == null || depth > 40) return "";
                  if (o instanceof JSONArray) {
                      JSONArray a = (JSONArray) o;
                      for (int i = 0; i < a.length(); i++) {
                          String r = histToken(a.opt(i), depth + 1);
                          if (!r.isEmpty()) return r;
                      }
                      return "";
                  }
                  if (!(o instanceof JSONObject)) return "";
                  JSONObject j = (JSONObject) o;
                  java.util.Iterator<String> it = j.keys();
                  while (it.hasNext()) {
                      String r = histToken(j.opt(it.next()), depth + 1);
                      if (!r.isEmpty()) return r;
                  }
                  String t = j.toString();
                  if (t.length() < 3000 && t.contains("feedbackToken") && HIST_WORD.matcher(t).find()) {
                      Matcher m = FB_TOKEN.matcher(t);
                      if (m.find()) return m.group(1);
                  }
                  return "";
              }

              private static void tagFeedback(JSONArray videos, String id, JSONObject node) {
                  try {
                      if (id == null || id.isEmpty() || videos.length() == 0) return;
                      JSONObject v = videos.optJSONObject(videos.length() - 1);
                      if (v == null || !id.equals(v.optString("id")) || v.has("fb")) return;
                      String tok = histToken(node, 0);
                      if (!tok.isEmpty()) v.put("fb", tok);
                  } catch (Exception ignored) { }
              }

              static JSONObject removeFromHistory(String token, String cookie) {
                  try {
                      if (loggedOut(cookie)) return error("login");
                      if (token == null || token.length() < 10 || token.length() > 4000) return error("Dieser Eintrag lässt sich nicht löschen");
                      JSONObject b = baseBody();
                      b.put("feedbackTokens", new JSONArray().put(token));
                      b.put("isFeedbackTokenUnencrypted", false);
                      b.put("shouldMerge", false);
                      String raw = postRaw("feedback", b, cookie);
                      if (raw.contains("\"isProcessed\":true") || raw.contains("\"isProcessed\": true")) {
                          JSONObject ok = new JSONObject();
                          ok.put("ok", true);
                          return ok;
                      }
                      return error("YouTube hat das Löschen nicht bestätigt");
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }

              private static final java.util.HashMap<String, String[]> TRACK = new java.util.HashMap<>();
              private static final String CPN_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

              private static String newCpn() {
                  java.util.Random r = new java.util.Random();
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < 16; i++) sb.append(CPN_CHARS.charAt(r.nextInt(CPN_CHARS.length())));
                  return sb.toString();
              }

              private static int pingUrl(String base, String extra, String cpn, String cookie) throws Exception {
                  String u = base + (base.contains("?") ? "&" : "?") + "ver=2&cpn=" + cpn + extra;
                  HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                  c.setConnectTimeout(10000);
                  c.setReadTimeout(10000);
                  c.setRequestProperty("User-Agent", UA);
                  c.setRequestProperty("Cookie", cookie);
                  c.setRequestProperty("Origin", "https://www.youtube.com");
                  c.setRequestProperty("Referer", "https://www.youtube.com/");
                  String auth = sapisidHash(cookie);
                  if (auth != null) c.setRequestProperty("Authorization", auth);
                  c.setRequestProperty("X-Goog-AuthUser", "0");
                  int code = c.getResponseCode();
                  try { readAll(code >= 400 ? c.getErrorStream() : c.getInputStream()); } catch (Exception ignored) { }
                  return code;
              }

              /** Meldet die Wiedergabe wie der YouTube-Player an das Konto: arg = "videoId|sekunden|phase" (phase: start, tick, end). */
              static JSONObject reportWatch(String arg, String cookie) {
                  try {
                      if (loggedOut(cookie)) return error("login");
                      String[] p = (arg == null ? "" : arg).split("\\|");
                      if (p.length < 2 || !VID.matcher(p[0]).matches()) return error("Ungültiges Video");
                      String id = p[0];
                      long pos = 0;
                      try { pos = (long) Double.parseDouble(p[1]); } catch (Exception ignored) { }
                      String phase = p.length > 2 ? p[2] : "start";
                      String[] t;
                      synchronized (TRACK) { t = TRACK.get(id); }
                      if (t == null || "start".equals(phase)) {
                          JSONObject b = baseBody();
                          b.put("videoId", id);
                          b.put("contentCheckOk", true);
                          b.put("racyCheckOk", true);
                          JSONObject d = new JSONObject(postRaw("player", b, cookie));
                          JSONObject pt = d.optJSONObject("playbackTracking");
                          JSONObject pb = pt == null ? null : pt.optJSONObject("videostatsPlaybackUrl");
                          JSONObject wt = pt == null ? null : pt.optJSONObject("videostatsWatchtimeUrl");
                          if (pb == null || pb.optString("baseUrl", "").isEmpty()) {
                              JSONObject ps = d.optJSONObject("playabilityStatus");
                              return error("YouTube lieferte keine Verlaufs-Adresse" + (ps == null ? "" : " (" + ps.optString("status", "") + ")"));
                          }
                          t = new String[]{pb.optString("baseUrl"), wt == null ? "" : wt.optString("baseUrl", ""), newCpn()};
                          synchronized (TRACK) {
                              if (TRACK.size() > 20) TRACK.clear();
                              TRACK.put(id, t);
                          }
                          int code = pingUrl(t[0], "&cmt=" + pos + "&st=" + pos + "&et=" + pos, t[2], cookie);
                          if (code >= 400) return error("YouTube hat die Wiedergabe nicht angenommen (HTTP " + code + ")");
                      }
                      if (!t[1].isEmpty()) {
                          pingUrl(t[1], "&cmt=" + pos + "&st=0&et=" + pos + "&state=" + ("end".equals(phase) ? "paused" : "playing"), t[2], cookie);
                      }
                      JSONObject ok = new JSONObject();
                      ok.put("ok", true);
                      return ok;
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }


              // ---------- Untertitel (für den eigenen Player): Liste und Inhalt, auch mit automatischer Übersetzung ----------
              static JSONObject capsList(String videoId, String cookie) {
                  try {
                      if (videoId == null || !VID.matcher(videoId).matches()) return error("Ungültiges Video");
                      String last = "keine Untertitel-Daten";
                      for (int w = 0; w < 3; w++) {
                          try {
                              String raw;
                              int ci = 0;
                              if (w == 0) { raw = NativeAudio.post(videoId, NativeAudio.CLIENTS[1]); ci = 1; }
                              else if (w == 1) { raw = NativeAudio.post(videoId, NativeAudio.CLIENTS[0]); ci = 0; }
                              else {
                                  if (loggedOut(cookie)) continue;
                                  JSONObject b = baseBody();
                                  b.put("videoId", videoId);
                                  b.put("contentCheckOk", true);
                                  b.put("racyCheckOk", true);
                                  raw = postRaw("player", b, cookie);
                                  ci = -1;
                              }
                              JSONObject d = new JSONObject(raw);
                              JSONObject cp = d.optJSONObject("captions");
                              JSONObject pr = cp == null ? null : cp.optJSONObject("playerCaptionsTracklistRenderer");
                              JSONArray tr = pr == null ? null : pr.optJSONArray("captionTracks");
                              if (tr == null || tr.length() == 0) { last = "dieses Video hat keine Untertitel"; continue; }
                              JSONArray out = new JSONArray();
                              for (int i = 0; i < tr.length(); i++) {
                                  JSONObject t = tr.optJSONObject(i);
                                  if (t == null || t.optString("baseUrl", "").isEmpty()) continue;
                                  JSONObject o = new JSONObject();
                                  o.put("n", text(t.opt("name")));
                                  o.put("l", t.optString("languageCode", ""));
                                  o.put("k", t.optString("kind", ""));
                                  o.put("u", t.optString("baseUrl", ""));
                                  o.put("c", ci);
                                  out.put(o);
                              }
                              if (out.length() == 0) continue;
                              JSONObject res = new JSONObject();
                              res.put("ok", true);
                              res.put("tracks", out);
                              return res;
                          } catch (Exception e) {
                              last = String.valueOf(e.getMessage());
                          }
                      }
                      return error(last);
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }

              /** arg = JSON {u: Untertitel-Adresse, tl: Zielsprache oder leer, c: Client}. Liefert Zeilen [startMs, endMs, text]. */
              static JSONObject capsGet(String arg) {
                  try {
                      JSONObject a = new JSONObject(arg == null ? "{}" : arg);
                      String u = a.optString("u", "");
                      String tl = a.optString("tl", "");
                      int ci = a.optInt("c", -1);
                      URL url0 = new URL(u);
                      String host = url0.getHost() == null ? "" : url0.getHost();
                      if (!(host.equals("www.youtube.com") || host.endsWith(".youtube.com")) || !url0.getPath().startsWith("/api/timedtext")) return error("Ungültige Untertitel-Adresse");
                      u = u.replaceAll("&fmt=[^&]*", "");
                      u += "&fmt=json3";
                      if (!tl.isEmpty() && tl.matches("^[a-zA-Z-]{2,8}$")) u += "&tlang=" + tl;
                      HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                      c.setConnectTimeout(12000);
                      c.setReadTimeout(15000);
                      c.setRequestProperty("User-Agent", ci >= 0 && ci < NativeAudio.CLIENTS.length ? NativeAudio.CLIENTS[ci][3] : UA);
                      c.setRequestProperty("Accept-Language", "de-DE,de;q=0.9,en;q=0.5");
                      int code = c.getResponseCode();
                      if (code >= 400) return error("YouTube antwortet nicht (HTTP " + code + ")");
                      String body = readAll(c.getInputStream());
                      if (body.trim().isEmpty()) return error("YouTube lieferte keinen Untertitel-Text");
                      JSONArray ev = new JSONObject(body).optJSONArray("events");
                      if (ev == null) return error("Keine Untertitel-Zeilen");
                      JSONArray cues = new JSONArray();
                      for (int i = 0; i < ev.length() && cues.length() < 6000; i++) {
                          JSONObject e = ev.optJSONObject(i);
                          if (e == null) continue;
                          JSONArray segs = e.optJSONArray("segs");
                          if (segs == null) continue;
                          StringBuilder sb = new StringBuilder();
                          for (int k = 0; k < segs.length(); k++) {
                              JSONObject sg = segs.optJSONObject(k);
                              if (sg != null) sb.append(sg.optString("utf8", ""));
                          }
                          String t = sb.toString().replace("\n", " ").trim();
                          if (t.isEmpty()) continue;
                          long s0 = e.optLong("tStartMs", 0);
                          cues.put(new JSONArray().put(s0).put(s0 + Math.max(500, e.optLong("dDurationMs", 2000))).put(t));
                      }
                      if (cues.length() == 0) return error("Keine Untertitel-Zeilen");
                      JSONObject res = new JSONObject();
                      res.put("ok", true);
                      res.put("cues", cues);
                      return res;
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }

              private static JSONObject error(String msg) {
                  JSONObject o = new JSONObject();
                  try { o.put("error", msg); } catch (Exception ignored) {}
                  return o;
              }

              static String text(Object t) {
                  if (t == null) return "";
                  if (t instanceof String) return (String) t;
                  if (t instanceof JSONObject) {
                      JSONObject o = (JSONObject) t;
                      if (o.has("simpleText")) return o.optString("simpleText", "");
                      if (o.has("content") && o.opt("content") instanceof String) return o.optString("content", "");
                      JSONArray runs = o.optJSONArray("runs");
                      if (runs != null) {
                          StringBuilder sb = new StringBuilder();
                          for (int k = 0; k < runs.length(); k++) {
                              JSONObject r = runs.optJSONObject(k);
                              if (r != null) sb.append(r.optString("text", ""));
                          }
                          return sb.toString();
                      }
                  }
                  return "";
              }

              static long durToSec(String s) {
                  if (s == null || s.isEmpty()) return 0;
                  long total = 0;
                  for (String p : s.trim().split(":")) {
                      try { total = total * 60 + Long.parseLong(p.trim()); } catch (NumberFormatException e) { return 0; }
                  }
                  return total;
              }

              /** Sucht in einem Eintrag den Anteil, den man schon gesehen hat (YouTube-Verlauf), in Prozent. */
              private static int findPercent(Object o, int depth) {
                  if (o == null || depth > 12) return -1;
                  if (o instanceof JSONObject) {
                      JSONObject j = (JSONObject) o;
                      if (j.has("percentDurationWatched")) return j.optInt("percentDurationWatched", -1);
                      if (j.has("startPercent")) return j.optInt("startPercent", -1);
                      java.util.Iterator<String> it = j.keys();
                      while (it.hasNext()) {
                          String k = it.next();
                          if (k.equals("menu") || k.equals("serviceEndpoint") || k.equals("navigationEndpoint")) continue;
                          int r = findPercent(j.opt(k), depth + 1);
                          if (r >= 0) return r;
                      }
                  } else if (o instanceof JSONArray) {
                      JSONArray a = (JSONArray) o;
                      for (int i = 0; i < a.length(); i++) {
                          int r = findPercent(a.opt(i), depth + 1);
                          if (r >= 0) return r;
                      }
                  }
                  return -1;
              }

              private static void tagProgress(JSONArray videos, String id, JSONObject src) {
                  try {
                      int p = findPercent(src, 0);
                      if (p < 0) return;
                      for (int i = videos.length() - 1; i >= 0; i--) {
                          JSONObject v = videos.optJSONObject(i);
                          if (v != null && id.equals(v.optString("id", ""))) { v.put("pct", p); return; }
                      }
                  } catch (Exception ignored) { }
              }

              private static void addVideo(JSONArray videos, HashSet<String> seen, String id, String title, String channel,
                                           long dur, String views, String when) throws Exception {
                  if (id == null || id.isEmpty() || seen.contains(id)) return;
                  seen.add(id);
                  JSONObject v = new JSONObject();
                  v.put("id", id);
                  v.put("title", title);
                  v.put("channel", channel);
                  v.put("dur", dur);
                  v.put("views", views);
                  v.put("when", when);
                  videos.put(v);
              }

              private static void addPlaylist(JSONArray playlists, HashSet<String> seen, String id, String title, String info) throws Exception {
                  if (id == null || id.isEmpty() || seen.contains(id)) return;
                  seen.add(id);
                  JSONObject p = new JSONObject();
                  p.put("id", id);
                  p.put("title", title);
                  p.put("info", info);
                  playlists.put(p);
              }

              private static void walk(Object o, JSONArray videos, JSONArray playlists, HashSet<String> seenV,
                                       HashSet<String> seenP, int depth, String[] next) throws Exception {
                  if (o == null || depth > 120) return;
                  if (o instanceof JSONArray) {
                      JSONArray a = (JSONArray) o;
                      for (int i = 0; i < a.length(); i++) walk(a.opt(i), videos, playlists, seenV, seenP, depth + 1, next);
                      return;
                  }
                  if (!(o instanceof JSONObject)) return;
                  JSONObject obj = (JSONObject) o;

                  for (String key : VIDEO_KEYS) {
                      JSONObject vr = obj.optJSONObject(key);
                      if (vr == null || !vr.has("videoId")) continue;
                      String title = text(vr.opt("title"));
                      if (title.isEmpty()) title = text(vr.opt("headline"));
                      String channel = text(vr.opt("ownerText"));
                      if (channel.isEmpty()) channel = text(vr.opt("shortBylineText"));
                      if (channel.isEmpty()) channel = text(vr.opt("longBylineText"));
                      long dur = vr.has("lengthSeconds") ? vr.optLong("lengthSeconds", 0) : durToSec(text(vr.opt("lengthText")));
                      String views = text(vr.opt("viewCountText"));
                      if (views.isEmpty()) views = text(vr.opt("shortViewCountText"));
                      addVideo(videos, seenV, vr.optString("videoId", ""), title, channel, dur, views, text(vr.opt("publishedTimeText")));
                      tagFeedback(videos, vr.optString("videoId", ""), vr);
                      tagProgress(videos, vr.optString("videoId", ""), vr);
                  }

                  JSONObject l = obj.optJSONObject("lockupViewModel");
                  if (l != null && l.has("contentId")) {
                      String type = l.optString("contentType", "");
                      String id = l.optString("contentId", "");
                      JSONObject md = l.optJSONObject("metadata");
                      JSONObject lm = md == null ? null : md.optJSONObject("lockupMetadataViewModel");
                      String title = lm == null ? "" : text(lm.opt("title"));
                      String channel = "", views = "", when = "";
                      if (lm != null) {
                          JSONObject m2 = lm.optJSONObject("metadata");
                          JSONObject cm = m2 == null ? null : m2.optJSONObject("contentMetadataViewModel");
                          JSONArray rows = cm == null ? null : cm.optJSONArray("metadataRows");
                          if (rows != null) {
                              java.util.ArrayList<String> parts = new java.util.ArrayList<>();
                              for (int r = 0; r < rows.length(); r++) {
                                  JSONObject row = rows.optJSONObject(r);
                                  JSONArray mp = row == null ? null : row.optJSONArray("metadataParts");
                                  if (mp == null) continue;
                                  for (int k = 0; k < mp.length(); k++) {
                                      JSONObject part = mp.optJSONObject(k);
                                      if (part != null) parts.add(text(part.opt("text")));
                                  }
                              }
                              if (parts.size() > 0) channel = parts.get(0);
                              if (parts.size() > 1) views = parts.get(1);
                              if (parts.size() > 2) when = parts.get(2);
                          }
                      }
                      if (type.contains("VIDEO")) {
                          long dur = 0;
                          JSONObject img = l.optJSONObject("contentImage");
                          if (img != null) {
                              Matcher m = DURATION.matcher(img.toString());
                              if (m.find()) dur = durToSec(m.group(1));
                          }
                          addVideo(videos, seenV, id, title, channel, dur, views, when);
                          tagFeedback(videos, id, l);
                          tagProgress(videos, id, l);
                      } else if (type.contains("PLAYLIST") || type.contains("PODCAST")) {
                          String info = channel + (views.isEmpty() ? "" : " · " + views);
                          addPlaylist(playlists, seenP, id, title, info);
                      }
                  }

                  for (String key : PLAYLIST_KEYS) {
                      JSONObject pr = obj.optJSONObject(key);
                      if (pr == null || !pr.has("playlistId")) continue;
                      String info = text(pr.opt("videoCountText"));
                      if (info.isEmpty()) info = text(pr.opt("videoCountShortText"));
                      addPlaylist(playlists, seenP, pr.optString("playlistId", ""), text(pr.opt("title")), info);
                  }

                  JSONObject cir = obj.optJSONObject("continuationItemRenderer");
                  if (cir != null) {
                      JSONObject ep = cir.optJSONObject("continuationEndpoint");
                      JSONObject cc = ep == null ? null : ep.optJSONObject("continuationCommand");
                      if (cc == null && ep != null) {
                          JSONArray cmds = null;
                          JSONObject ce = ep.optJSONObject("commandExecutorCommand");
                          if (ce != null) cmds = ce.optJSONArray("commands");
                          if (cmds != null) {
                              for (int q = 0; q < cmds.length(); q++) {
                                  JSONObject cmd = cmds.optJSONObject(q);
                                  if (cmd != null && cmd.optJSONObject("continuationCommand") != null) cc = cmd.optJSONObject("continuationCommand");
                              }
                          }
                      }
                      if (cc != null && !cc.optString("token", "").isEmpty()) next[0] = cc.optString("token");
                  }

                  java.util.Iterator<String> keys = obj.keys();
                  while (keys.hasNext()) {
                      String k = keys.next();
                      Object child = obj.opt(k);
                      if (child instanceof JSONObject || child instanceof JSONArray) walk(child, videos, playlists, seenV, seenP, depth + 1, next);
                  }
              }
          }
