          package com.foxysoxy.bravetube;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.HashSet;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Lädt YouTube-Seiten mit den Cookies des angemeldeten Kontos und liest Videos und Playlists aus ytInitialData. */
          final class YtFetcher {
              private YtFetcher() {}

              static final String UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
              private static final Pattern PLAYLIST_ID = Pattern.compile("^[A-Za-z0-9_-]{2,64}$");
              private static final Pattern DURATION = Pattern.compile("\"text\":\"(\\d{1,2}(?::\\d{2}){1,2})\"");
              private static final String[] VIDEO_KEYS = {
                      "videoRenderer", "playlistVideoRenderer", "compactVideoRenderer", "gridVideoRenderer",
                      "videoWithContextRenderer", "playlistPanelVideoRenderer"};
              private static final String[] PLAYLIST_KEYS = {"gridPlaylistRenderer", "playlistRenderer", "compactPlaylistRenderer"};

              /** Holt einen Byte-Bereich vom Videoserver selbst (wie der Ton im Hintergrund): arg = "von bis adresse". Gibt Status und Daten (Base64) zurück. */
              static JSONObject rangeFetch(String arg) {
                  JSONObject out = new JSONObject();
                  HttpURLConnection c = null;
                  try {
                      out.put("ok", true);
                      if ("probe".equals(arg)) { out.put("probe", true); return out; }
                      String[] p = String.valueOf(arg).split(" ", 3);
                      if (p.length < 3) { out.put("error", "Ungültige Anfrage"); return out; }
                      long a = Long.parseLong(p[0]);
                      long b = Long.parseLong(p[1]);
                      String url = p[2];
                      if (b < a || b - a > 2_000_000L || !url.startsWith("https://") || !url.contains(".googlevideo.com/")) { out.put("error", "Ungültiger Bereich"); return out; }
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod("GET");
                      c.setConnectTimeout(12000);
                      c.setReadTimeout(20000);
                      c.setInstanceFollowRedirects(true);
                      c.setRequestProperty("User-Agent", NativeAudio.streamUa.isEmpty() ? UA : NativeAudio.streamUa);
                      c.setRequestProperty("Accept-Encoding", "identity");
                      c.setRequestProperty("Range", "bytes=" + a + "-" + b);
                      int code = c.getResponseCode();
                      out.put("status", code);
                      if (code != 200 && code != 206) { out.put("msg", String.valueOf(c.getResponseMessage())); return out; }
                      long want = b - a + 1;
                      java.io.InputStream in = c.getInputStream();
                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream((int) Math.min(want, 1 << 20));
                      byte[] buf = new byte[32768];
                      long got = 0;
                      while (got < want) {
                          int r = in.read(buf, 0, (int) Math.min(buf.length, want - got));
                          if (r < 0) break;
                          bo.write(buf, 0, r);
                          got += r;
                      }
                      out.put("n", got);
                      out.put("b64", android.util.Base64.encodeToString(bo.toByteArray(), android.util.Base64.NO_WRAP));
                      StreamProxy.last = "Bereich " + a + "-" + b + " -> " + code + ", " + got + " Byte";
                  } catch (Exception e) {
                      try { out.put("error", e.getClass().getSimpleName() + " " + e.getMessage()); } catch (Exception ignored) { }
                      StreamProxy.last = "Bereich Fehler " + e.getClass().getSimpleName() + " " + e.getMessage();
                  } finally {
                      try { if (c != null) c.disconnect(); } catch (Exception ignored) { }
                  }
                  return out;
              }

              static JSONObject fetch(String kind, String arg, String cookie) {
                  try {
                      String url;
                      switch (kind) {
                          case "home": url = "https://www.youtube.com/"; break;
                          case "more": return fetchMore(arg, cookie);
                          case "stream": return NativeAudio.streamJson(arg);
                          case "proxy": { JSONObject po = new JSONObject(); po.put("ok", true); po.put("last", StreamProxy.last); po.put("n", StreamProxy.count); return po; }
                          case "range": return rangeFetch(arg);
                          case "clients": return ClientProbe.run(arg);
                          case "state": return videoState(arg, cookie);
                          case "comments": return commentsPage(arg, cookie);
                          case "like": return doLike(arg, cookie);
                          case "subscribe": return doSubscribe(arg, cookie);
                          case "comment": return doComment(arg, cookie);
                          case "report": return reportWatch(arg, cookie);
                          case "unhist": return removeFromHistory(arg, cookie);
                          case "pladd": return addToPlaylist(arg, cookie);
                          case "caps": return capsList(arg, cookie);
                          case "capget": return capsGet(arg);
                          case "history": url = "https://www.youtube.com/feed/history"; break;
                          case "wl": url = "https://www.youtube.com/playlist?list=WL"; break;
                          case "playlists": url = "https://www.youtube.com/feed/playlists"; break;
                          case "playlist":
                              if (arg == null || !PLAYLIST_ID.matcher(arg).matches()) return error("Ungültige Playlist");
                              url = "https://www.youtube.com/playlist?list=" + arg;
                              break;
                          default: return error("Unbekannte Anfrage");
                      }
                      if (cookie == null || !cookie.contains("SAPISID=")) return error("login");

                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setInstanceFollowRedirects(true);
                      c.setRequestProperty("User-Agent", UA);
                      c.setRequestProperty("Accept", "text/html,application/xhtml+xml");
                      c.setRequestProperty("Accept-Language", "de-DE,de;q=0.9,en;q=0.5");
                      c.setRequestProperty("Cookie", cookie);
                      int code = c.getResponseCode();
                      String finalHost = c.getURL().getHost() == null ? "" : c.getURL().getHost();
                      if (code >= 400) return error("YouTube antwortet nicht (HTTP " + code + ")");
                      String html = readAll(c.getInputStream());
                      if (finalHost.contains("consent.youtube.com") || finalHost.contains("accounts.google.com")) return error("login");
                      if (html.contains("\"LOGGED_IN\":false")) return error("login");

                      JSONObject data = extractInitialData(html);
                      if (data == null) return error("YouTube-Seite konnte nicht gelesen werden");

                      JSONArray videos = new JSONArray();
                      JSONArray playlists = new JSONArray();
                      String[] next = new String[1];
                      walk(data, videos, playlists, new HashSet<>(), new HashSet<>(), 0, next);
                      remember(html);

                      JSONObject res = new JSONObject();
                      res.put("ok", true);
                      if (next[0] != null) res.put("next", next[0]);
                      res.put("videos", videos);
                      res.put("playlists", playlists);
                      res.put("at", System.currentTimeMillis());
                      return res;
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }

              // ---------- Weitere Videos nachladen (Fortsetzung) ----------
              private static volatile String apiKey = "";
              private static volatile String clientVersion = "";
              private static volatile String visitorData = "";

              private static String firstMatch(String html, String regex) {
                  Matcher m = Pattern.compile(regex).matcher(html);
                  return m.find() ? m.group(1) : "";
              }

              static void remember(String html) {
                  String k = firstMatch(html, "\"INNERTUBE_API_KEY\":\"([^\"]+)\"");
                  String v = firstMatch(html, "\"INNERTUBE_CONTEXT_CLIENT_VERSION\":\"([^\"]+)\"");
                  String d = firstMatch(html, "\"VISITOR_DATA\":\"([^\"]+)\"");
                  if (!k.isEmpty()) apiKey = k;
                  if (!v.isEmpty()) clientVersion = v;
                  if (!d.isEmpty()) visitorData = d;
              }

              private static String cookieValue(String cookie, String name) {
                  for (String part : cookie.split(";")) {
                      String p = part.trim();
                      if (p.startsWith(name + "=")) return p.substring(name.length() + 1);
                  }
                  return "";
              }

              static String sapisidHash(String cookie) throws Exception {
                  long ts = System.currentTimeMillis() / 1000;
                  String sid = cookieValue(cookie, "SAPISID");
                  String s1 = cookieValue(cookie, "__Secure-1PAPISID");
                  String s3 = cookieValue(cookie, "__Secure-3PAPISID");
                  if (sid.isEmpty()) sid = s3.isEmpty() ? s1 : s3;
                  if (sid.isEmpty()) return null;
                  StringBuilder out = new StringBuilder("SAPISIDHASH " + ts + "_" + sha1(ts + " " + sid + " https://www.youtube.com"));
                  if (!s1.isEmpty()) out.append(" SAPISID1PHASH ").append(ts).append('_').append(sha1(ts + " " + s1 + " https://www.youtube.com"));
                  if (!s3.isEmpty()) out.append(" SAPISID3PHASH ").append(ts).append('_').append(sha1(ts + " " + s3 + " https://www.youtube.com"));
                  return out.toString();
              }

              private static String sha1(String in) throws Exception {
                  MessageDigest md = MessageDigest.getInstance("SHA-1");
                  byte[] h = md.digest(in.getBytes(StandardCharsets.UTF_8));
                  StringBuilder sb = new StringBuilder();
                  for (byte b : h) sb.append(String.format("%02x", b));
                  return sb.toString();
              }

              static JSONObject fetchMore(String token, String cookie) {
                  try {
                      if (token == null || token.length() < 10 || token.length() > 8000) return error("Ungültige Fortsetzung");
                      if (cookie == null || !cookie.contains("SAPISID=")) return error("login");
                      loadConfig(cookie);
                      if (apiKey.isEmpty()) return error("YouTube-Konfiguration nicht gefunden");

                      JSONObject client = new JSONObject();
                      client.put("clientName", "WEB");
                      client.put("clientVersion", clientVersion.isEmpty() ? "2.20250101.00.00" : clientVersion);
                      client.put("hl", "de");
                      client.put("gl", "DE");
                      if (!visitorData.isEmpty()) client.put("visitorData", visitorData);
                      JSONObject context = new JSONObject();
                      context.put("client", client);
                      JSONObject body = new JSONObject();
                      body.put("context", context);
                      body.put("continuation", token);

                      HttpURLConnection c = (HttpURLConnection) new URL("https://www.youtube.com/youtubei/v1/browse?prettyPrint=false&key=" + apiKey).openConnection();
                      c.setRequestMethod("POST");
                      c.setDoOutput(true);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setRequestProperty("User-Agent", UA);
                      c.setRequestProperty("Content-Type", "application/json");
                      c.setRequestProperty("Accept-Language", "de-DE,de;q=0.9,en;q=0.5");
                      c.setRequestProperty("Origin", "https://www.youtube.com");
                      c.setRequestProperty("X-Origin", "https://www.youtube.com");
                      c.setRequestProperty("X-Goog-AuthUser", "0");
                      c.setRequestProperty("X-Youtube-Client-Name", "1");
                      c.setRequestProperty("X-Youtube-Client-Version", clientVersion);
                      if (!visitorData.isEmpty()) c.setRequestProperty("X-Goog-Visitor-Id", visitorData);
                      c.setRequestProperty("Cookie", cookie);
                      String auth = sapisidHash(cookie);
                      if (auth != null) c.setRequestProperty("Authorization", auth);
                      c.getOutputStream().write(body.toString().getBytes(StandardCharsets.UTF_8));
                      int code = c.getResponseCode();
                      if (code >= 400) return error("YouTube antwortet nicht (HTTP " + code + ")");
                      JSONObject data = new JSONObject(readAll(c.getInputStream()));

                      JSONArray videos = new JSONArray();
                      JSONArray playlists = new JSONArray();
                      String[] next = new String[1];
                      walk(data, videos, playlists, new HashSet<>(), new HashSet<>(), 0, next);
                      JSONObject res = new JSONObject();
                      res.put("ok", true);
                      res.put("videos", videos);
                      res.put("playlists", playlists);
                      if (next[0] != null) res.put("next", next[0]);
                      res.put("at", System.currentTimeMillis());
                      return res;
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }

              // ---------- Video-Funktionen mit Konto: Status, Kommentare, Like, Abonnieren ----------
              static void loadConfig(String cookie) throws Exception {
                  if (!apiKey.isEmpty()) return;
                  HttpURLConnection c = (HttpURLConnection) new URL("https://www.youtube.com/").openConnection();
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(20000);
                  c.setRequestProperty("User-Agent", UA);
                  c.setRequestProperty("Accept-Language", "de-DE,de;q=0.9,en;q=0.5");
                  c.setRequestProperty("Cookie", cookie);
                  remember(readAll(c.getInputStream()));
              }

              private static JSONObject baseBody() throws Exception {
                  JSONObject client = new JSONObject();
                  client.put("clientName", "WEB");
                  client.put("clientVersion", clientVersion.isEmpty() ? "2.20250101.00.00" : clientVersion);
                  client.put("hl", "de");
                  client.put("gl", "DE");
                  if (!visitorData.isEmpty()) client.put("visitorData", visitorData);
                  JSONObject context = new JSONObject();
                  context.put("client", client);
                  context.put("user", new JSONObject().put("lockedSafetyMode", false));
                  context.put("request", new JSONObject().put("useSsl", true));
                  JSONObject body = new JSONObject();
                  body.put("context", context);
                  return body;
              }

              static String postRaw(String endpoint, JSONObject body, String cookie) throws Exception {
                  loadConfig(cookie);
                  if (apiKey.isEmpty()) throw new Exception("YouTube-Konfiguration nicht gefunden");
                  HttpURLConnection c = (HttpURLConnection) new URL("https://www.youtube.com/youtubei/v1/" + endpoint + "?prettyPrint=false&key=" + apiKey).openConnection();
                  c.setRequestMethod("POST");
                  c.setDoOutput(true);
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(25000);
                  c.setRequestProperty("User-Agent", UA);
                  c.setRequestProperty("Content-Type", "application/json");
                  c.setRequestProperty("Accept-Language", "de-DE,de;q=0.9,en;q=0.5");
                  c.setRequestProperty("Origin", "https://www.youtube.com");
                  c.setRequestProperty("X-Origin", "https://www.youtube.com");
                  c.setRequestProperty("X-Goog-AuthUser", "0");
                  c.setRequestProperty("X-Youtube-Client-Name", "1");
                  c.setRequestProperty("X-Youtube-Client-Version", clientVersion);
                  if (!visitorData.isEmpty()) c.setRequestProperty("X-Goog-Visitor-Id", visitorData);
                  c.setRequestProperty("Cookie", cookie);
                  String auth = sapisidHash(cookie);
                  if (auth != null) c.setRequestProperty("Authorization", auth);
                  c.getOutputStream().write(body.toString().getBytes(StandardCharsets.UTF_8));
                  int code = c.getResponseCode();
                  if (code >= 400) {
                      String why = "";
                      try {
                          java.io.InputStream es = c.getErrorStream();
                          if (es != null) {
                              JSONObject eo = new JSONObject(readAll(es)).optJSONObject("error");
                              if (eo != null) why = eo.optString("message", "") + " " + eo.optString("status", "");
                          }
                      } catch (Exception ignored) { }
                      if (code == 401 || code == 403) why = (why + " Bitte in den Einstellungen neu bei YouTube anmelden.").trim();
                      throw new Exception("YouTube antwortet nicht (HTTP " + code + (why.trim().isEmpty() ? "" : ": " + why.trim()) + ")");
                  }
                  return readAll(c.getInputStream());
              }

              private static boolean loggedOut(String cookie) {
                  return cookie == null || !cookie.contains("SAPISID=");
              }

              static Object findFirst(Object o, String key, int depth) {
                  if (o == null || depth > 80) return null;
                  if (o instanceof JSONObject) {
                      JSONObject j = (JSONObject) o;
                      if (j.has(key)) return j.opt(key);
                      java.util.Iterator<String> it = j.keys();
                      while (it.hasNext()) {
                          Object r = findFirst(j.opt(it.next()), key, depth + 1);
                          if (r != null) return r;
                      }
                  } else if (o instanceof JSONArray) {
                      JSONArray a = (JSONArray) o;
                      for (int i = 0; i < a.length(); i++) {
                          Object r = findFirst(a.opt(i), key, depth + 1);
                          if (r != null) return r;
                      }
                  }
                  return null;
              }

              static void findAll(Object o, String key, java.util.List<JSONObject> out, int depth) {
                  if (o == null || depth > 80) return;
                  if (o instanceof JSONObject) {
                      JSONObject j = (JSONObject) o;
                      JSONObject hit = j.optJSONObject(key);
                      if (hit != null) out.add(hit);
                      java.util.Iterator<String> it = j.keys();
                      while (it.hasNext()) findAll(j.opt(it.next()), key, out, depth + 1);
                  } else if (o instanceof JSONArray) {
                      JSONArray a = (JSONArray) o;
                      for (int i = 0; i < a.length(); i++) findAll(a.opt(i), key, out, depth + 1);
                  }
              }

              static JSONObject videoState(String videoId, String cookie) {
                  try {
                      if (videoId == null || !PLAYLIST_ID.matcher(videoId).matches()) return error("Ungültiges Video");
                      if (loggedOut(cookie)) return error("login");
                      JSONObject b = baseBody();
                      b.put("videoId", videoId);
                      String raw = postRaw("next", b, cookie);
                      return parseState(raw);
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }

              static JSONObject parseState(String raw) throws Exception {
                  JSONObject d = new JSONObject(raw);
                  JSONObject res = new JSONObject();
                  res.put("ok", true);
                  String like = firstMatch(raw, "\"likeStatus\":\"(\\w+)\"");
                  if (!like.isEmpty()) res.put("likeStatus", like);
                  Object sb = findFirst(d, "subscribeButtonRenderer", 0);
                  if (sb instanceof JSONObject) {
                      JSONObject sr = (JSONObject) sb;
                      if (sr.has("subscribed")) res.put("subscribed", sr.optBoolean("subscribed", false));
                      String cid = sr.optString("channelId", "");
                      if (!cid.isEmpty()) res.put("channelId", cid);
                  }
                  if (!res.has("subscribed")) {
                      String sub = firstMatch(raw, "\"subscribed\":(true|false)");
                      if (!sub.isEmpty()) res.put("subscribed", "true".equals(sub));
                  }
                  Object owner = findFirst(d, "videoOwnerRenderer", 0);
                  JSONObject ow = owner instanceof JSONObject ? (JSONObject) owner : null;
                  if (!res.has("channelId") && ow != null) {
                      Object be = findFirst(ow, "browseEndpoint", 0);
                      if (be instanceof JSONObject) {
                          String id = ((JSONObject) be).optString("browseId", "");
                          if (id.startsWith("UC")) res.put("channelId", id);
                      }
                  }
                  if (!res.has("channelId")) {
                      String cid = firstMatch(raw, "\"channelId\":\"(UC[\\w-]{22})\"");
                      if (!cid.isEmpty()) res.put("channelId", cid);
                  }
                  JSONObject info = new JSONObject();
                  Object pi = findFirst(d, "videoPrimaryInfoRenderer", 0);
                  if (pi instanceof JSONObject) {
                      JSONObject p = (JSONObject) pi;
                      info.put("title", text(p.opt("title")));
                      info.put("when", text(p.opt("dateText")));
                      Object vc = findFirst(p, "videoViewCountRenderer", 0);
                      if (vc instanceof JSONObject) info.put("views", text(((JSONObject) vc).opt("viewCount")));
                  }
                  if (ow != null) info.put("channel", text(ow.opt("title")));
                  Object si = findFirst(d, "videoSecondaryInfoRenderer", 0);
                  if (si instanceof JSONObject) {
                      JSONObject sec = (JSONObject) si;
                      JSONObject ad = sec.optJSONObject("attributedDescription");
                      String desc = ad != null ? ad.optString("content", "") : "";
                      if (desc.isEmpty()) desc = text(sec.opt("description"));
                      info.put("desc", desc);
                  }
                  if (!info.has("desc") || info.optString("desc", "").isEmpty()) {
                      // Neuere YouTube-Antworten legen die Beschreibung in ein eigenes Feld.
                      String desc = "";
                      Object ab = findFirst(d, "attributedDescriptionBodyText", 0);
                      if (ab instanceof JSONObject) desc = ((JSONObject) ab).optString("content", "");
                      if (desc.isEmpty()) {
                          Object db = findFirst(d, "descriptionBodyText", 0);
                          if (db != null) desc = text(db);
                      }
                      if (desc.isEmpty()) {
                          Object ad2 = findFirst(d, "attributedDescription", 0);
                          if (ad2 instanceof JSONObject) desc = ((JSONObject) ad2).optString("content", "");
                      }
                      info.put("desc", desc);
                  }
                  info.put("live", raw.contains("\"isLive\":true"));
                  info.put("chat", raw.contains("\"liveChatRenderer\""));
                  res.put("info", info);
                  // Fortsetzung für Kommentare
                  java.util.List<JSONObject> sections = new java.util.ArrayList<>();
                  findAll(d, "itemSectionRenderer", sections, 0);
                  for (JSONObject sec : sections) {
                      if ("comment-item-section".equals(sec.optString("sectionIdentifier", ""))) {
                          String[] nx = new String[1];
                          walk(sec, new JSONArray(), new JSONArray(), new HashSet<>(), new HashSet<>(), 0, nx);
                          if (nx[0] != null) res.put("commentsToken", nx[0]);
                      }
                  }
                  return res;
              }

              static JSONObject commentsPage(String token, String cookie) {
                  try {
                      if (token == null || token.length() < 10 || token.length() > 8000) return error("Ungültige Fortsetzung");
                      if (loggedOut(cookie)) return error("login");
                      JSONObject b = baseBody();
                      b.put("continuation", token);
                      return parseComments(postRaw("next", b, cookie));
                  } catch (Exception e) {
                      return error(e.getMessage() == null ? e.toString() : e.getMessage());
                  }
              }

              static JSONObject parseComments(String raw) throws Exception {
                  JSONObject d = new JSONObject(raw);
                  java.util.HashMap<String, JSONObject> ent = new java.util.HashMap<>();
                  java.util.List<JSONObject> payloads = new java.util.ArrayList<>();
                  findAll(d, "commentEntityPayload", payloads, 0);
                  for (JSONObject pl : payloads) {
                      JSONObject props = pl.optJSONObject("properties");
                      String id = props == null ? "" : props.optString("commentId", "");
                      if (!id.isEmpty()) ent.put(id, pl);
                  }
                  JSONArray items = new JSONArray();
                  java.util.HashSet<String> seen = new java.util.HashSet<>();
                  java.util.List<JSONObject> threads = new java.util.ArrayList<>();
                  findAll(d, "commentThreadRenderer", threads, 0);
                  for (JSONObject t : threads) {
                      JSONObject o = new JSONObject();
                      Object cvm = findFirst(t, "commentViewModel", 0);
                      String cid = "";
                      if (cvm instanceof JSONObject) {
                          Object inner = ((JSONObject) cvm).opt("commentViewModel");
                          JSONObject src = inner instanceof JSONObject ? (JSONObject) inner : (JSONObject) cvm;
                          cid = src.optString("commentId", "");
                      }
                      JSONObject pl = cid.isEmpty() ? null : ent.get(cid);
                      if (pl != null) {
                          JSONObject props = pl.optJSONObject("properties");
                          JSONObject author = pl.optJSONObject("author");
                          JSONObject tb = pl.optJSONObject("toolbar");
                          JSONObject content = props == null ? null : props.optJSONObject("content");
                          o.put("author", author == null ? "" : author.optString("displayName", ""));
                          o.put("text", content == null ? "" : content.optString("content", ""));
                          o.put("when", props == null ? "" : props.optString("publishedTime", ""));
                          o.put("likes", tb == null ? "" : tb.optString("likeCountNotliked", ""));
                      } else {
                          Object cr = findFirst(t, "commentRenderer", 0);
                          if (!(cr instanceof JSONObject)) continue;
                          JSONObject c = (JSONObject) cr;
                          o.put("author", text(c.opt("authorText")));
                          o.put("text", text(c.opt("contentText")));
                          o.put("when", text(c.opt("publishedTimeText")));
                          o.put("likes", text(c.opt("voteCount")));
                          cid = c.optString("commentId", "");
                      }
                      if (o.optString("text", "").isEmpty()) continue;
                      if (!cid.isEmpty() && !seen.add(cid)) continue;
                      items.put(o);
                  }
                  JSONObject res = new JSONObject();
                  res.put("ok", true);
                  res.put("items", items);
                  String[] nx = new String[1];
                  walk(d, new JSONArray(), new JSONArray(), new HashSet<>(), new HashSet<>(), 0, nx);
                  if (nx[0] != null) res.put("next", nx[0]);
                  String params = firstMatch(raw, "\"createCommentParams\":\"([^\"]+)\"");
                  if (!params.isEmpty()) res.put("params", params);
                  return res;
              }

