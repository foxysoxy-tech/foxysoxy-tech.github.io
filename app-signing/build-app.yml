          package com.foxysoxy.bravetube;

          import android.webkit.WebResourceResponse;

          import java.io.FilterInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Holt Video-Daten von googlevideo.com mit dem User-Agent, der die Adresse ausgestellt hat (sonst lehnt YouTube sie ab). */
          final class StreamProxy {
              private StreamProxy() {}

              /** Letzter Vorgang (für die Fehlersuche, die Seite kann das abfragen). */
              static volatile String last = "noch nichts geladen";
              static volatile int count = 0;

              private static final Pattern RANGE = Pattern.compile("bytes=(\\d*)-(\\d*)");

              static WebResourceResponse fetch(String url, Map<String, String> reqHeaders, String ua) {
                  String range = null;
                  if (reqHeaders != null) {
                      for (Map.Entry<String, String> e : reqHeaders.entrySet()) {
                          if ("range".equalsIgnoreCase(e.getKey())) range = e.getValue();
                      }
                  }
                  long start = 0;
                  long end = -1;
                  boolean suffix = false;
                  if (range != null) {
                      Matcher m = RANGE.matcher(range);
                      if (m.find()) {
                          suffix = m.group(1).isEmpty();
                          try { if (!m.group(1).isEmpty()) start = Long.parseLong(m.group(1)); } catch (Exception ignored) { }
                          try { if (!m.group(2).isEmpty()) end = Long.parseLong(m.group(2)); } catch (Exception ignored) { }
                      }
                  }
                  count++;
                  String tag = "#" + count + " " + (range == null ? "ohne Range" : range);
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod("GET");
                      c.setConnectTimeout(12000);
                      c.setReadTimeout(20000);
                      c.setInstanceFollowRedirects(true);
                      c.setRequestProperty("User-Agent", ua);
                      c.setRequestProperty("Accept-Encoding", "identity");
                      if (range != null) c.setRequestProperty("Range", range);
                      int code = c.getResponseCode();
                      if (code != 200 && code != 206) {
                          last = tag + " -> HTTP " + code;
                          c.disconnect();
                          return null;
                      }
                      InputStream raw = c.getInputStream();
                      final HttpURLConnection conn = c;
                      long len = -1;
                      try { len = Long.parseLong(String.valueOf(c.getHeaderField("Content-Length")).trim()); } catch (Exception ignored) { }
                      String cr = c.getHeaderField("Content-Range");
                      int status = code;
                      long total = -1;
                      if (code == 206 && cr != null) {
                          int sl = cr.lastIndexOf('/');
                          if (sl > 0) { try { total = Long.parseLong(cr.substring(sl + 1).trim()); } catch (Exception ignored) { } }
                      }
                      if (code == 200 && range != null && !suffix && total < 0 && len > 0 && (start > 0 || end >= 0)) {
                          // Server hat den Bereich ignoriert und schickt alles: Anfang überspringen und als Teilantwort weitergeben.
                          total = len;
                          long skipped = 0;
                          while (skipped < start) {
                              long s = raw.skip(start - skipped);
                              if (s <= 0) { if (raw.read() < 0) break; s = 1; }
                              skipped += s;
                          }
                          if (skipped < start) { last = tag + " -> Überspringen fehlgeschlagen"; c.disconnect(); return null; }
                          long e2 = end >= 0 ? Math.min(end, total - 1) : total - 1;
                          if (e2 < start) { last = tag + " -> Bereich ungültig"; c.disconnect(); return null; }
                          cr = "bytes " + start + "-" + e2 + "/" + total;
                          len = e2 - start + 1;
                          status = 206;
                      } else if (code == 206 && cr == null && len >= 0) {
                          long e2 = start + len - 1;
                          cr = "bytes " + start + "-" + e2 + "/" + (total >= 0 ? total : "*");
                      }
                      String type = c.getContentType();
                      if (type == null) type = "video/mp4";
                      int semi = type.indexOf(';');
                      String mime = semi > 0 ? type.substring(0, semi).trim() : type;
                      Map<String, String> h = new HashMap<>();
                      if (len >= 0) h.put("Content-Length", String.valueOf(len));
                      if (cr != null && status == 206) h.put("Content-Range", cr);
                      h.put("Accept-Ranges", "bytes");
                      h.put("Access-Control-Allow-Origin", "*");
                      last = tag + " -> " + status + (cr != null ? " " + cr : "") + (len >= 0 ? " Länge " + len : "");
                      final long[] left = {(status == 206 && len >= 0) ? len : Long.MAX_VALUE};
                      InputStream in = new FilterInputStream(raw) {
                          @Override public int read() throws IOException {
                              if (left[0] <= 0) return -1;
                              int b = super.read();
                              if (b >= 0) left[0]--;
                              return b;
                          }
                          @Override public int read(byte[] buf, int off, int n) throws IOException {
                              if (left[0] <= 0) return -1;
                              int r = super.read(buf, off, (int) Math.min((long) n, left[0]));
                              if (r > 0) left[0] -= r;
                              return r;
                          }
                          @Override public void close() throws IOException {
                              try { super.close(); } finally { conn.disconnect(); }
                          }
                      };
                      return new WebResourceResponse(mime, null, status, status == 206 ? "Partial Content" : "OK", h, in);
                  } catch (Exception e) {
                      last = tag + " -> Fehler " + e.getClass().getSimpleName() + " " + e.getMessage();
                      try { if (c != null) c.disconnect(); } catch (Exception ignored) { }
                      return null;
                  }
              }
          }
