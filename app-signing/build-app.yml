          package com.foxysoxy.bravetube;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          /** Holt eine direkte Audio-Adresse eines Videos, damit die App den Ton selbst abspielen kann (Hintergrund / gesperrter Bildschirm). */
          final class NativeAudio {
              private NativeAudio() {}

              static final class Result {
                  final List<String> urls = new ArrayList<>();
                  String ua = "";
                  String error = "";
              }

              static final String[][] CLIENTS = {
                      // name, version, id, user agent, extra JSON für den Client
                      {"ANDROID_VR", "1.65.10", "28",
                              "com.google.android.apps.youtube.vr.oculus/1.65.10 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip",
                              "{\"deviceMake\":\"Oculus\",\"deviceModel\":\"Quest 3\",\"androidSdkVersion\":32,\"osName\":\"Android\",\"osVersion\":\"12L\"}"},
                      {"ANDROID", "20.10.38", "3",
                              "com.google.android.youtube/20.10.38 (Linux; U; Android 11) gzip",
                              "{\"osName\":\"Android\",\"osVersion\":\"11\"}"},
                      {"ANDROID_VR", "1.60.19", "28",
                              "com.google.android.apps.youtube.vr.oculus/1.60.19 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip",
                              "{\"deviceMake\":\"Oculus\",\"deviceModel\":\"Quest 3\",\"androidSdkVersion\":32,\"osName\":\"Android\",\"osVersion\":\"12L\"}"},
                      {"ANDROID", "19.44.38", "3",
                              "com.google.android.youtube/19.44.38 (Linux; U; Android 11) gzip",
                              "{\"androidSdkVersion\":30,\"osName\":\"Android\",\"osVersion\":\"11\"}"},
              };

              /** User-Agent des Clients, der die zuletzt gelieferte Stream-Adresse ausgestellt hat (für den Proxy im WebView). */
              static volatile String streamUa = "";

              /** Video mit Ton in einer Datei (ohne Werbung), für den eigenen Player der Seite. */
              static org.json.JSONObject streamJson(String videoId) {
                  org.json.JSONObject out = new org.json.JSONObject();
                  try {
                      if (videoId == null || !videoId.matches("^[A-Za-z0-9_-]{11}$")) { out.put("error", "Ungültiges Video"); return out; }
                      StringBuilder all = new StringBuilder();
                      for (String[] c : CLIENTS) {
                          String last;
                          try {
                              String raw = post(videoId, c);
                              String url = pickMuxed(raw);
                              JSONObject ad = pickAdaptive(raw);
                              if (url != null || ad != null) {
                                  streamUa = c[3];
                                  out.put("ok", true);
                                  if (url != null) out.put("url", url);
                                  if (ad != null) out.put("ad", ad);
                                  out.put("client", c[0]);
                                  return out;
                              }
                              last = c[0] + " " + c[1] + ": " + status(raw);
                          } catch (Exception e) {
                              last = c[0] + " " + c[1] + ": " + e.getMessage();
                          }
                          if (all.length() > 0) all.append(" | ");
                          all.append(last);
                      }
                      out.put("error", all.length() == 0 ? "keine Antwort" : all.toString());
                  } catch (Exception e) {
                      try { out.put("error", String.valueOf(e.getMessage())); } catch (Exception ignored) { }
                  }
                  return out;
              }

              /** Bild (H.264, bis 1080p) und Ton (AAC) als getrennte Dateien: hohe Qualität, Zusammenspiel macht die Seite per MediaSource. */
              static JSONObject pickAdaptive(String raw) throws Exception {
                  JSONObject o = new JSONObject(raw);
                  JSONObject sd = o.optJSONObject("streamingData");
                  if (sd == null) return null;
                  JSONArray ad = sd.optJSONArray("adaptiveFormats");
                  if (ad == null) return null;
                  JSONObject bestV = null, bestA = null;
                  int bestH = -1;
                  JSONArray opts = new JSONArray();
                  long bestRate = -1;
                  for (int i = 0; i < ad.length(); i++) {
                      JSONObject f = ad.optJSONObject(i);
                      if (f == null || f.optString("url", "").isEmpty()) continue;
                      String mime = f.optString("mimeType", "");
                      if (f.optLong("contentLength", 0) <= 0 || f.optJSONObject("indexRange") == null || f.optJSONObject("initRange") == null) continue;
                      if (mime.startsWith("video/mp4") && (mime.contains("avc1") || mime.contains("av01"))) {
                          int h = f.optInt("height", 0);
                          JSONObject oo = fmt(f);
                          oo.put("h", h);
                          oo.put("fps", f.optInt("fps", 30));
                          oo.put("codec", mime.contains("av01") ? "av1" : "avc");
                          opts.put(oo);
                          if (!mime.contains("avc1") || h > 1080) continue;
                          if (h > bestH) { bestH = h; bestV = f; }
                      } else if (mime.startsWith("audio/mp4") && mime.contains("mp4a")) {
                          long rate = f.optInt("itag", 0) == 140 ? Long.MAX_VALUE : f.optLong("bitrate", 0);
                          if (rate > bestRate) { bestRate = rate; bestA = f; }
                      }
                  }
                  if (bestV == null || bestA == null) return null;
                  JSONObject r = new JSONObject();
                  r.put("v", fmt(bestV));
                  r.put("a", fmt(bestA));
                  r.put("h", bestH);
                  r.put("opts", opts);
                  return r;
              }

              private static JSONObject fmt(JSONObject f) throws Exception {
                  JSONObject x = new JSONObject();
                  x.put("url", f.optString("url", ""));
                  x.put("mime", f.optString("mimeType", ""));
                  x.put("len", f.optLong("contentLength", 0));
                  x.put("init", new JSONArray().put(f.getJSONObject("initRange").optLong("start", 0)).put(f.getJSONObject("initRange").optLong("end", 0)));
                  x.put("idx", new JSONArray().put(f.getJSONObject("indexRange").optLong("start", 0)).put(f.getJSONObject("indexRange").optLong("end", 0)));
                  x.put("dur", f.optLong("approxDurationMs", 0));
                  return x;
              }

              /** Höchste Auflösung bis 720p aus den kombinierten Formaten (Video + Ton in einer Datei). */
              static String pickMuxed(String raw) throws Exception {
                  JSONObject o = new JSONObject(raw);
                  JSONObject sd = o.optJSONObject("streamingData");
                  if (sd == null) return null;
                  JSONArray fm = sd.optJSONArray("formats");
                  if (fm == null) return null;
                  String best = null;
                  int bestH = -1;
                  for (int i = 0; i < fm.length(); i++) {
                      JSONObject f = fm.optJSONObject(i);
                      if (f == null) continue;
                      String url = f.optString("url", "");
                      if (url.isEmpty() || !f.optString("mimeType", "").startsWith("video/mp4")) continue;
                      int h = f.optInt("height", 0);
                      int score = h <= 720 ? h : 0;
                      if (score > bestH) { bestH = score; best = url; }
                  }
                  return best;
              }

              static Result resolve(String videoId) {
                  Result r = new Result();
                  String last = "keine Antwort";
                  for (String[] c : CLIENTS) {
                      try {
                          String raw = post(videoId, c);
                          List<String> urls = pickUrls(raw);
                          if (!urls.isEmpty()) {
                              r.urls.addAll(urls);
                              r.ua = c[3];
                              return r;
                          }
                          last = status(raw);
                      } catch (Exception e) {
                          last = String.valueOf(e.getMessage());
                      }
                  }
                  r.error = last;
                  return r;
              }

              static String post(String videoId, String[] c) throws Exception {
                  JSONObject client = new JSONObject(c[4]);
                  client.put("clientName", c[0]);
                  client.put("clientVersion", c[1]);
                  client.put("hl", "de");
                  client.put("gl", "DE");
                  JSONObject context = new JSONObject();
                  context.put("client", client);
                  JSONObject body = new JSONObject();
                  body.put("context", context);
                  body.put("videoId", videoId);
                  body.put("contentCheckOk", true);
                  body.put("racyCheckOk", true);
                  HttpURLConnection h = (HttpURLConnection) new URL("https://www.youtube.com/youtubei/v1/player?prettyPrint=false").openConnection();
                  h.setRequestMethod("POST");
                  h.setDoOutput(true);
                  h.setConnectTimeout(12000);
                  h.setReadTimeout(15000);
                  h.setRequestProperty("User-Agent", c[3]);
                  h.setRequestProperty("Content-Type", "application/json");
                  h.setRequestProperty("X-YouTube-Client-Name", c[2]);
                  h.setRequestProperty("X-YouTube-Client-Version", c[1]);
                  h.setRequestProperty("Origin", "https://www.youtube.com");
                  h.getOutputStream().write(body.toString().getBytes(StandardCharsets.UTF_8));
                  int code = h.getResponseCode();
                  if (code >= 400) {
                      String why = "";
                      try {
                          String eb = YtFetcher.readAll(h.getErrorStream());
                          JSONObject eo = new JSONObject(eb).optJSONObject("error");
                          if (eo != null) why = " " + eo.optString("status", "") + " " + eo.optString("message", "");
                      } catch (Exception ignored) { }
                      throw new Exception("HTTP " + code + (why.trim().isEmpty() ? "" : " " + why.trim().replaceAll("\\s+", " ")));
                  }
                  return YtFetcher.readAll(h.getInputStream());
              }

              static String status(String raw) {
                  try {
                      JSONObject o = new JSONObject(raw);
                      JSONObject ps = o.optJSONObject("playabilityStatus");
                      if (ps != null) {
                          String s = ps.optString("status", "");
                          String why = ps.optString("reason", "");
                          if (!s.isEmpty() && !"OK".equals(s)) return s + (why.isEmpty() ? "" : ": " + why);
                      }
                      return "keine Audio-Adresse";
                  } catch (Exception e) {
                      return "Antwort nicht lesbar";
                  }
              }

              /** Reihenfolge: reiner Ton (AAC), dann kombinierter Stream (Video + Ton) als Ersatz. */
              static List<String> pickUrls(String raw) throws Exception {
                  List<String> out = new ArrayList<>();
                  JSONObject o = new JSONObject(raw);
                  JSONObject sd = o.optJSONObject("streamingData");
                  if (sd == null) return out;
                  String audio = null;
                  long bestRate = -1;
                  JSONArray ad = sd.optJSONArray("adaptiveFormats");
                  if (ad != null) {
                      for (int i = 0; i < ad.length(); i++) {
                          JSONObject f = ad.optJSONObject(i);
                          if (f == null) continue;
                          String mime = f.optString("mimeType", "");
                          String url = f.optString("url", "");
                          if (url.isEmpty() || !mime.startsWith("audio/mp4")) continue;
                          long rate = f.optLong("bitrate", 0);
                          boolean is140 = f.optInt("itag", 0) == 140;
                          if (is140) rate = Long.MAX_VALUE;
                          if (rate > bestRate) {
                              bestRate = rate;
                              audio = url;
                          }
                      }
                  }
                  if (audio != null) out.add(audio);
                  JSONArray fm = sd.optJSONArray("formats");
                  if (fm != null) {
                      for (int i = 0; i < fm.length(); i++) {
                          JSONObject f = fm.optJSONObject(i);
                          if (f == null) continue;
                          String url = f.optString("url", "");
                          if (!url.isEmpty() && f.optString("mimeType", "").startsWith("video/mp4")) {
                              out.add(url);
                              break;
                          }
                      }
                  }
                  return out;
              }
          }
