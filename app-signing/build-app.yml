          cat > 'android/app/src/main/java/com/foxysoxy/bravetube/MediaService.java' <<'BTEOF'
          package com.foxysoxy.bravetube;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.media.AudioAttributes;
          import android.media.MediaMetadata;
          import android.media.MediaPlayer;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;

          import java.util.HashMap;
          import java.util.Map;

          /** Hält die App am Leben und spielt bei gesperrtem Bildschirm / im Hintergrund den Ton selbst ab. */
          public class MediaService extends Service {
              private static final String CHANNEL = "playback";
              static final String ACTION_NTOGGLE = "com.foxysoxy.bravetube.NTOGGLE";
              static final String ACTION_NSTARTED = "com.foxysoxy.bravetube.NSTARTED";
              static final String ACTION_NFAILED = "com.foxysoxy.bravetube.NFAILED";
              static final String ACTION_NDONE = "com.foxysoxy.bravetube.NDONE";

              static volatile String title = "";
              private static volatile MediaPlayer nativePlayer;
              private static volatile boolean nativeReady;

              private PowerManager.WakeLock wake;
              private MediaSession session;
              private String[] urls = new String[0];
              private int urlIndex;
              private String ua = "";
              private int startMs;
              private long capAt;

              /** Läuft der App-eigene Ton gerade (oder wird er vorbereitet)? */
              static boolean nativeActive() { return nativePlayer != null; }

              static int nativePosMs() {
                  MediaPlayer p = nativePlayer;
                  try { return p != null && nativeReady ? p.getCurrentPosition() : -1; } catch (Exception e) { return -1; }
              }

              static boolean nativeIsPlaying() {
                  MediaPlayer p = nativePlayer;
                  try { return p != null && nativeReady && p.isPlaying(); } catch (Exception e) { return false; }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  showForeground();
                  if (intent != null) {
                      if (ACTION_NTOGGLE.equals(intent.getAction())) {
                          toggleNative();
                      } else if (intent.hasExtra("urls")) {
                          urls = intent.getStringArrayExtra("urls");
                          if (urls == null) urls = new String[0];
                          ua = intent.getStringExtra("ua");
                          if (ua == null) ua = "";
                          startMs = Math.max(0, intent.getIntExtra("startMs", 0));
                          capAt = intent.getLongExtra("capAt", 0);
                          urlIndex = 0;
                          startNative();
                      }
                  }
                  return START_NOT_STICKY;
              }

              private void showForeground() {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (nm != null) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Wiedergabe", NotificationManager.IMPORTANCE_LOW);
                      ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                  }
                  Intent open = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  PendingIntent toggle = PendingIntent.getService(this, 2,
                          new Intent(this, MediaService.class).setAction(ACTION_NTOGGLE),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Action act = new Notification.Action.Builder(
                          Icon.createWithResource(this, R.drawable.ic_pause), "Pause / Weiter", toggle).build();
                  if (wake == null) {
                      PowerManager pm = getSystemService(PowerManager.class);
                      if (pm != null) {
                          wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "BraveTube:play");
                          wake.setReferenceCounted(false);
                          wake.acquire(4 * 60 * 60 * 1000L);
                      }
                  }
                  if (session == null) {
                      session = new MediaSession(this, "BraveTube");
                      session.setCallback(new MediaSession.Callback() {
                          @Override public void onPlay() { toggleNative(); }
                          @Override public void onPause() { toggleNative(); }
                      });
                      session.setActive(true);
                  }
                  setPlaybackState(true);
                  String t = title == null || title.isEmpty() ? "Wiedergabe läuft im Hintergrund" : title;
                  session.setMetadata(new MediaMetadata.Builder().putString(MediaMetadata.METADATA_KEY_TITLE, t).putString(MediaMetadata.METADATA_KEY_ARTIST, "BraveTube").build());
                  Notification n = new Notification.Builder(this, CHANNEL)
                          .setStyle(new Notification.MediaStyle().setMediaSession(session.getSessionToken()))
                          .addAction(act)
                          .setSmallIcon(R.drawable.ic_play)
                          .setContentTitle("BraveTube")
                          .setContentText(t)
                          .setOngoing(true)
                          .setContentIntent(pi)
                          .build();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(1, n);
                  }
              }

              private void setPlaybackState(boolean playing) {
                  if (session == null) return;
                  long pos = nativePosMs();
                  session.setPlaybackState(new PlaybackState.Builder()
                          .setActions(PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE)
                          .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED,
                                  pos < 0 ? PlaybackState.PLAYBACK_POSITION_UNKNOWN : pos, 1f).build());
              }

              private void toggleNative() {
                  MediaPlayer p = nativePlayer;
                  if (p == null || !nativeReady) {
                      // Kein App-Ton aktiv: Befehl an die Seite weitergeben.
                      sendBroadcast(new Intent(MainActivity.ACTION_TOGGLE).setPackage(getPackageName()));
                      return;
                  }
                  try {
                      if (p.isPlaying()) {
                          p.pause();
                          setPlaybackState(false);
                      } else {
                          p.start();
                          setPlaybackState(true);
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void releasePlayer() {
                  MediaPlayer p = nativePlayer;
                  nativePlayer = null;
                  nativeReady = false;
                  if (p != null) {
                      try { p.reset(); } catch (Exception ignored) { }
                      try { p.release(); } catch (Exception ignored) { }
                  }
              }

              private void fail(String msg) {
                  releasePlayer();
                  sendBroadcast(new Intent(ACTION_NFAILED).setPackage(getPackageName()).putExtra("msg", msg));
              }

              private void startNative() {
                  releasePlayer();
                  if (urlIndex >= urls.length) {
                      fail("Audio-Adresse wurde nicht akzeptiert");
                      return;
                  }
                  final String url = urls[urlIndex];
                  try {
                      final MediaPlayer p = new MediaPlayer();
                      nativePlayer = p;
                      nativeReady = false;
                      p.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                      p.setWakeMode(this, PowerManager.PARTIAL_WAKE_LOCK);
                      Map<String, String> h = new HashMap<>();
                      if (!ua.isEmpty()) h.put("User-Agent", ua);
                      p.setDataSource(this, Uri.parse(url), h);
                      p.setOnPreparedListener(mp -> {
                          if (nativePlayer != mp) return;
                          try {
                              // Die Seite lief weiter, während die App den Ton vorbereitet hat: genau dort einsteigen, damit keine Lücke entsteht.
                              int target = startMs;
                              if (capAt > 0 && startMs > 0) target += (int) Math.max(0, Math.min(15000, SystemClock.elapsedRealtime() - capAt)) + 120;
                              if (target > 1000) {
                                  final int tg = target;
                                  mp.setOnSeekCompleteListener(m2 -> {
                                      m2.setOnSeekCompleteListener(null);
                                      begin(m2);
                                  });
                                  try { mp.seekTo((long) tg, MediaPlayer.SEEK_CLOSEST); } catch (Throwable t) { mp.seekTo(tg); }
                              } else {
                                  begin(mp);
                              }
                          } catch (Exception e) {
                              tryNext();
                          }
                      });
                      p.setOnErrorListener((mp, what, extra) -> {
                          if (nativePlayer != mp) return true;
                          if (nativeReady) {
                              fail("Wiedergabe-Fehler " + what);
                          } else {
                              tryNext();
                          }
                          return true;
                      });
                      p.setOnCompletionListener(mp -> {
                          if (nativePlayer != mp) return;
                          sendBroadcast(new Intent(ACTION_NDONE).setPackage(getPackageName()));
                      });
                      p.prepareAsync();
                  } catch (Exception e) {
                      tryNext();
                  }
              }

              private void tryNext() {
                  urlIndex++;
                  startNative();
              }

              private void begin(MediaPlayer mp) {
                  if (nativePlayer != mp) return;
                  try {
                      mp.start();
                      nativeReady = true;
                      setPlaybackState(true);
                      sendBroadcast(new Intent(ACTION_NSTARTED).setPackage(getPackageName()));
                  } catch (Exception e) {
                      tryNext();
                  }
              }

              @Override
              public void onDestroy() {
                  releasePlayer();
                  if (session != null) { try { session.setActive(false); session.release(); } catch (Exception ignored) { } session = null; }
                  if (wake != null && wake.isHeld()) wake.release();
                  wake = null;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
