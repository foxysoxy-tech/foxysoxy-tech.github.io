# BraveTube App – dieser Workflow baut die Android-App (APK) und legt sie als Release ab.
# Neu bauen: Actions → "BraveTube App bauen" → "Run workflow".
name: BraveTube App bauen

on:
  push:
    paths:
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Signierschlüssel anlegen (nur beim ersten Mal)
        run: |
          if [ ! -f app-signing/bravetube.jks ]; then
            mkdir -p app-signing
            keytool -genkeypair -v -keystore app-signing/bravetube.jks -storepass bravetube -keypass bravetube \
              -alias bravetube -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=BraveTube, O=BraveTube, C=BG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-signing/bravetube.jks
            git commit -m "App-Signierschlüssel für BraveTube"
            git push || (git pull --rebase && git push)
          fi

      - name: Projektdateien schreiben
        run: |
          mkdir -p "$(dirname 'android/app/build.gradle')"
          cat > 'android/app/build.gradle' <<'BTEOF'
          plugins { id 'com.android.application' }

          def buildNo = (System.getenv('BT_BUILD') ?: '1').toInteger()

          android {
              namespace 'com.foxysoxy.bravetube'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.foxysoxy.bravetube'
                  minSdk 26
                  targetSdk 35
                  versionCode buildNo
                  versionName "1.${buildNo}"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('BT_KEYSTORE') ?: '../../app-signing/bravetube.jks')
                      storePassword 'bravetube'
                      keyAlias 'bravetube'
                      keyPassword 'bravetube'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/AndroidManifest.xml')"
          cat > 'android/app/src/main/AndroidManifest.xml' <<'BTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.software.picture_in_picture" android:required="false" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode|density|fontScale|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- YouTube-Links (Video, Shorts, Live) öffnen direkt in BraveTube -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" />
                          <data android:scheme="http" />
                          <data android:host="www.youtube.com" />
                          <data android:host="m.youtube.com" />
                          <data android:host="youtube.com" />
                          <data android:pathPrefix="/watch" />
                          <data android:pathPrefix="/shorts" />
                          <data android:pathPrefix="/live" />
                          <data android:pathPrefix="/embed" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" />
                          <data android:scheme="http" />
                          <data android:host="youtu.be" />
                      </intent-filter>
                      <!-- „Teilen“ aus anderen Apps -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".LoginActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden" />

                  <service
                      android:name=".MediaService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/assets/shim.js')"
          cat > 'android/app/src/main/assets/shim.js' <<'BTEOF'
          // Brücke zwischen der BraveTube-Seite und der App (läuft nur auf foxysoxy-tech.github.io)
          (function () {
            if (window.__btShim) return;
            window.__btShim = true;

            function native() { return window.BraveTubeNative; }

            function post(obj) {
              var n = native();
              if (!n) return false;
              try { n.postMessage(JSON.stringify(obj)); return true; } catch (e) { return false; }
            }

            function hook() {
              var n = native();
              if (!n || n.__btHooked) return;
              n.__btHooked = true;
              n.onmessage = function (e) {
                var m;
                try { m = JSON.parse(e.data); } catch (err) { return; }
                if (!m) return;
                if (m.id != null) window.postMessage({ bt: 'res', id: m.id, res: m.res }, '*');
                else if (m.event) window.postMessage({ bt: 'event', event: m.event, on: m.on, t: m.t, play: m.play, msg: m.msg }, '*');
              };
            }

            window.addEventListener('message', function (e) {
              var d = e.data;
              if (!d || typeof d !== 'object') return;
              if (d.bt === 'req') {
                if (d.kind === 'ping') { window.postMessage({ bt: 'res', id: d.id, res: { ok: true, v: 'app' } }, '*'); return; }
                hook();
                var ok = post({ id: d.id, kind: String(d.kind || ''), arg: d.arg == null ? '' : String(d.arg) });
                if (!ok) window.postMessage({ bt: 'res', id: d.id, res: { error: 'App-Brücke nicht verfügbar' } }, '*');
              } else if (d.bt === 'cmd') {
                hook();
                post(d);
              }
            });

            function hello() { hook(); window.postMessage({ bt: 'ready', v: 'app' }, '*'); }
            hello();
            document.addEventListener('DOMContentLoaded', hello);
            window.addEventListener('load', hello);
          })();
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/assets/visibility.js')"
          cat > 'android/app/src/main/assets/visibility.js' <<'BTEOF'
          // Läuft in YouTube-Frames: lässt den Player glauben, die Seite sei sichtbar,
          // damit die Wiedergabe im Hintergrund weiterläuft (wie "Hintergrundwiedergabe" in Brave).
          (function () {
            try {
              Object.defineProperty(document, 'hidden', { get: function () { return false; }, configurable: true });
              Object.defineProperty(document, 'visibilityState', { get: function () { return 'visible'; }, configurable: true });
              Object.defineProperty(document, 'webkitHidden', { get: function () { return false; }, configurable: true });
              Object.defineProperty(document, 'webkitVisibilityState', { get: function () { return 'visible'; }, configurable: true });
            } catch (e) { }
            var block = function (e) { e.stopImmediatePropagation(); };
            window.addEventListener('visibilitychange', block, true);
            document.addEventListener('visibilitychange', block, true);
            window.addEventListener('webkitvisibilitychange', block, true);
            document.addEventListener('webkitvisibilitychange', block, true);
          })();
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/java/com/foxysoxy/bravetube/Assets.java')"
          cat > 'android/app/src/main/java/com/foxysoxy/bravetube/Assets.java' <<'BTEOF'
          package com.foxysoxy.bravetube;

          import android.content.Context;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          final class Assets {
              private Assets() {}

              static String read(Context c, String name) {
                  try (InputStream in = c.getAssets().open(name)) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return new String(out.toByteArray(), StandardCharsets.UTF_8);
                  } catch (IOException e) {
                      return "";
                  }
              }
          }
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/java/com/foxysoxy/bravetube/LoginActivity.java')"
          cat > 'android/app/src/main/java/com/foxysoxy/bravetube/LoginActivity.java' <<'BTEOF'
          package com.foxysoxy.bravetube;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /** Einmalige Anmeldung bei YouTube. Die Cookies landen im gemeinsamen Cookie-Speicher der App. */
          public class LoginActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(0xFF111013);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setBackgroundColor(0xFF111013);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  int pad = (int) (12 * getResources().getDisplayMetrics().density);
                  bar.setPadding(pad, pad, pad, pad);

                  TextView title = new TextView(this);
                  title.setText("Bei YouTube anmelden");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(17);
                  title.setTypeface(null, Typeface.BOLD);
                  bar.addView(title, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button done = new Button(this);
                  done.setText("Fertig");
                  done.setOnClickListener(v -> finishWithResult());
                  bar.addView(done, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  col.addView(bar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  web = new WebView(this);
                  col.addView(web, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(col);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  // Google lehnt Anmeldungen in eingebetteten Ansichten ab; der Browser-Kennung werden deshalb die WebView-Merkmale genommen.
                  String ua = s.getUserAgentString().replace("; wv", "").replaceAll("Version/[\\d.]+ ", "");
                  s.setUserAgentString(ua);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (url != null && url.contains("youtube.com/") && !url.contains("accounts.") && !url.contains("consent.") && loggedIn()) {
                              finishWithResult();
                          }
                      }
                  });

                  web.loadUrl("https://accounts.google.com/ServiceLogin?service=youtube&hl=de&continue="
                          + Uri.encode("https://www.youtube.com/feed/history"));
              }

              static boolean loggedIn() {
                  String c = CookieManager.getInstance().getCookie("https://www.youtube.com");
                  return c != null && c.contains("SAPISID=");
              }

              private void finishWithResult() {
                  CookieManager.getInstance().flush();
                  setResult(loggedIn() ? RESULT_OK : RESULT_CANCELED);
                  finish();
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else finishWithResult();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          BTEOF
          mkdir -p "$(dirname 'android/app/src/main/java/com/foxysoxy/bravetube/MainActivity.java')"
          cat > 'android/app/src/main/java/com/foxysoxy/bravetube/MainActivity.java' <<'BTEOF'
          package com.foxysoxy.bravetube;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.app.PictureInPictureParams;
          import android.app.RemoteAction;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.graphics.drawable.Icon;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.util.Rational;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.webkit.JavaScriptReplyProxy;
          import androidx.webkit.WebMessageCompat;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              /** WebView, die nie als „verdeckt“ gemeldet wird: Ton und Video laufen auch bei gesperrtem Bildschirm weiter. */
              static class BgWebView extends WebView {
                  BgWebView(Context c) { super(c); }

                  @Override
                  protected void onWindowVisibilityChanged(int visibility) {
                      if (visibility != View.GONE) super.onWindowVisibilityChanged(View.VISIBLE);
                  }
              }

              static final String HOST = "foxysoxy-tech.github.io";
              static final String SITE = "https://" + HOST + "/";
              static final String FALLBACK_PAGE = "BraveTube2.8.html";
              static final String API_LIST = "https://api.github.com/repos/foxysoxy-tech/foxysoxy-tech.github.io/contents/";
              static final String ACTION_TOGGLE = "com.foxysoxy.bravetube.TOGGLE";
              static final String ACTION_AUDIO = "com.foxysoxy.bravetube.AUDIO";
              static final int REQ_LOGIN = 11;
              static final int RECEIVER_NOT_EXPORTED_FLAG = 4;

              private FrameLayout root;
              private WebView web;
              private View fullscreenView;
              private WebChromeClient.CustomViewCallback fullscreenCallback;
              private WebChromeClient chrome;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private final ExecutorService bg = Executors.newSingleThreadExecutor();
              private final ExecutorService rangeEx = Executors.newFixedThreadPool(4);
              private JavaScriptReplyProxy proxy;
              private boolean playing, audioOnly, inPip, bridgeOk, startScriptOk;
              private boolean pageMini;
              private boolean helloSeen;
              private String pendingLink = "";
              private BroadcastReceiver pipReceiver;
              private BroadcastReceiver audioReceiver;
              private BroadcastReceiver nativeReceiver;
              private BroadcastReceiver screenReceiver;
              // Eigener Ton im Hintergrund (App-Player), wenn der Bildschirm gesperrt ist oder die App im Hintergrund liegt.
              private final ExecutorService nat = Executors.newSingleThreadExecutor();
              private boolean bgMode, nativeBusy;
              private String vid = "", cachedVid = "", nativeVid = "", failedVid = "", prefetching = "", bgNote = "";
              private NativeAudio.Result cachedRes;
              private double lastT = -1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(0xFF111013);
                  getWindow().setNavigationBarColor(0xFF1C1A1F);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF111013);
                  web = new BgWebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);
                  setupWeb();

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 7);
                  }

                  pipReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          sendEvent("toggle", null);
                      }
                  };
                  audioReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          // Kopfhörer-Taste im Mini-Fenster: Nur Ton, Mini-Fenster schließen, im Hintergrund weiterhören.
                          audioOnly = true;
                          sendEvent("audio", true);
                          moveTaskToBack(true);
                      }
                  };
                  nativeReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          onNativeResult(intent);
                      }
                  };
                  screenReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          // Bildschirm aus / gesperrt: Ton sofort selbst weiterspielen.
                          bgMode = true;
                          startBackground();
                          maybeNative();
                      }
                  };
                  IntentFilter nf = new IntentFilter();
                  nf.addAction(MediaService.ACTION_NSTARTED);
                  nf.addAction(MediaService.ACTION_NFAILED);
                  nf.addAction(MediaService.ACTION_NDONE);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(pipReceiver, new IntentFilter(ACTION_TOGGLE), RECEIVER_NOT_EXPORTED_FLAG);
                      registerReceiver(audioReceiver, new IntentFilter(ACTION_AUDIO), RECEIVER_NOT_EXPORTED_FLAG);
                      registerReceiver(nativeReceiver, nf, RECEIVER_NOT_EXPORTED_FLAG);
                  } else {
                      registerReceiver(pipReceiver, new IntentFilter(ACTION_TOGGLE));
                      registerReceiver(audioReceiver, new IntentFilter(ACTION_AUDIO));
                      registerReceiver(nativeReceiver, nf);
                  }
                  registerReceiver(screenReceiver, new IntentFilter(Intent.ACTION_SCREEN_OFF));

                  loadStart();
                  handleLinkIntent(getIntent());
              }

              private void setupWeb() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(false);
                  // Die Seite darf nie als Ganzes gezoomt werden (sonst bleibt sie nach Zwei-Finger-Zoom riesig und abgeschnitten).
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setTextZoom(100);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.setBackgroundColor(0xFF111013);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  // Damit der eingebettete Player das angemeldete Konto sieht und Videos im YouTube-Verlauf landen.
                  cm.setAcceptThirdPartyCookies(web, true);

                  HashSet<String> site = new HashSet<>(Arrays.asList("https://" + HOST));
                  HashSet<String> yt = new HashSet<>(Arrays.asList("https://*.youtube.com", "https://*.youtube-nocookie.com"));

                  if (WebViewFeature.isFeatureSupported(WebViewFeature.WEB_MESSAGE_LISTENER)) {
                      WebViewCompat.addWebMessageListener(web, "BraveTubeNative", site, this::onBridgeMessage);
                      bridgeOk = true;
                  }
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      startScriptOk = true;
                      WebViewCompat.addDocumentStartJavaScript(web, Assets.read(this, "visibility.js"), yt);
                      if (bridgeOk) WebViewCompat.addDocumentStartJavaScript(web, Assets.read(this, "shim.js"), site);
                  }
                  if (!bridgeOk) {
                      toast("Bitte „Android System WebView“ im Play Store aktualisieren, damit Verlauf und Listen laden.");
                  }

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) return false;
                          Uri u = request.getUrl();
                          String h = u.getHost();
                          if (h != null && h.equalsIgnoreCase(HOST)) return false;
                          openExternal(u.toString());
                          return true;
                      }

                      @Override
                      public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          try {
                              Uri u = request.getUrl();
                              String h = u.getHost();
                              String ref = request.getRequestHeaders() == null ? null : request.getRequestHeaders().get("Referer");
                              if (h != null && h.endsWith(".googlevideo.com") && "GET".equals(request.getMethod())
                                      && !NativeAudio.streamUa.isEmpty() && (ref == null ? u.getPath() != null && u.getPath().startsWith("/videoplayback") : ref.contains(HOST))) {
                                  return StreamProxy.fetch(u.toString(), request.getRequestHeaders(), NativeAudio.streamUa);
                              }
                          } catch (Exception ignored) {
                          }
                          return null;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          helloSeen = false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (bridgeOk && !startScriptOk && url != null && url.startsWith(SITE)) {
                              view.evaluateJavascript(Assets.read(MainActivity.this, "shim.js"), null);
                          }
                      }
                  });

                  chrome = new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          // Der Vollbild-Knopf des Players: statt Android-Vollbild (Seite versteckt, kein Zoom, Leisten sichtbar)
                          // das eigene Querformat-Vollbild der Seite benutzen bzw. wieder zurück ins Hochformat.
                          if (vid != null && !vid.isEmpty() && fullscreenView == null) {
                              try { callback.onCustomViewHidden(); } catch (Exception ignored) { }
                              ui.post(() -> landscapeButton(true));
                              return;
                          }
                          if (fullscreenView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          fullscreenView = view;
                          fullscreenCallback = callback;
                          root.addView(view, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          web.setVisibility(View.GONE);
                          immersive(true);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (fullscreenView == null) return;
                          root.removeView(fullscreenView);
                          fullscreenView = null;
                          web.setVisibility(View.VISIBLE);
                          immersive(false);
                          relayout();
                          try { setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT); } catch (Exception ignored) { }
                          ui.postDelayed(() -> {
                              try { setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED); } catch (Exception ignored) { }
                          }, 1500);
                          if (fullscreenCallback != null) {
                              fullscreenCallback.onCustomViewHidden();
                              fullscreenCallback = null;
                          }
                      }
                  };
                  web.setWebChromeClient(chrome);
              }

              // ---------- Start: neueste BraveTubeX.Y.html aus dem Repository ----------

              private void loadStart() {
                  final SharedPreferences prefs = getSharedPreferences("bt", MODE_PRIVATE);
                  final String last = prefs.getString("url", SITE + FALLBACK_PAGE);
                  web.loadUrl(last);
                  bg.execute(() -> {
                      final String best = findNewest();
                      if (best != null && !best.equals(last)) {
                          prefs.edit().putString("url", best).apply();
                          ui.post(() -> web.loadUrl(best));
                      }
                  });
              }

              private String findNewest() {
                  try {
                      HttpURLConnection c = (HttpURLConnection) new URL(API_LIST).openConnection();
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      c.setRequestProperty("Accept", "application/vnd.github+json");
                      c.setRequestProperty("User-Agent", "BraveTube-App");
                      if (c.getResponseCode() != 200) return null;
                      JSONArray a = new JSONArray(YtFetcher.readAll(c.getInputStream()));
                      Pattern pat = Pattern.compile("^BraveTube(\\d+)(?:\\.(\\d+))?\\.html$");
                      String bestName = null;
                      long bestScore = -1;
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject f = a.optJSONObject(i);
                          if (f == null) continue;
                          Matcher m = pat.matcher(f.optString("name", ""));
                          if (!m.matches()) continue;
                          long score = Long.parseLong(m.group(1)) * 100000L + (m.group(2) != null ? Long.parseLong(m.group(2)) : 0);
                          if (score > bestScore) {
                              bestScore = score;
                              bestName = f.optString("name", "");
                          }
                      }
                      return bestName == null ? null : SITE + bestName;
                  } catch (Exception e) {
                      return null;
                  }
              }

              // ---------- Brücke zur Seite ----------

              private void onBridgeMessage(WebView view, WebMessageCompat message, Uri sourceOrigin, boolean isMainFrame, JavaScriptReplyProxy replyProxy) {
                  if (!isMainFrame) return;
                  proxy = replyProxy;
                  String data = message.getData();
                  if (data == null) return;
                  try {
                      JSONObject m = new JSONObject(data);
                      if (m.has("cmd")) {
                          handleCmd(m);
                          return;
                      }
                      final int id = m.getInt("id");
                      final String kind = m.optString("kind", "");
                      final String arg = m.optString("arg", "");
                      final String cookie = CookieManager.getInstance().getCookie("https://www.youtube.com");
                      ("range".equals(kind) ? rangeEx : bg).execute(() -> reply(id, YtFetcher.fetch(kind, arg, cookie)));
                  } catch (Exception ignored) {
                  }
              }

              private void handleCmd(JSONObject m) {
                  String cmd = m.optString("cmd", "");
                  switch (cmd) {
                      case "login":
                          startActivityForResult(new Intent(this, LoginActivity.class), REQ_LOGIN);
                          break;
                      case "pip":
                          enterPip(true);
                          break;
                      case "state":
                          playing = m.optBoolean("playing", false);
                          audioOnly = m.optBoolean("audio", false);
                          pageMini = m.optBoolean("mini", false);
                          String t = m.optString("title", "");
                          if (!t.isEmpty()) MediaService.title = t;
                          vid = m.optString("vid", "");
                          double tt = m.optDouble("t", -1);
                          if (tt >= 0) lastT = tt;
                          applyState();
                          updateLandscape(getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE);
                          if (playing) prefetch(vid);
                          if (playing && bgMode) {
                              startBackground();
                              maybeNative();
                          }
                          break;
                      case "open":
                          openExternal(m.optString("url", ""));
                          break;
                      case "hello":
                          helloSeen = true;
                          if (!pendingLink.isEmpty()) sendOpenVideo();
                          try {
                              JSONObject o = new JSONObject();
                              o.put("event", "appinfo");
                              o.put("t", getPackageManager().getPackageInfo(getPackageName(), 0).versionCode);
                              sendRaw(o);
                          } catch (Exception ignored) { }
                          break;
                      case "unland":
                          leaveLandscape();
                          break;
                      case "land":
                          landscapeButton(false);
                          break;
                      case "logout":
                          try {
                              CookieManager.getInstance().removeAllCookies(null);
                              CookieManager.getInstance().flush();
                          } catch (Exception ignored) { }
                          sendEvent("login", false);
                          break;
                      case "share":
                          shareText(m.optString("title", ""), m.optString("url", ""));
                          break;
                      default:
                          break;
                  }
              }

              private void reply(final int id, final JSONObject res) {
                  ui.post(() -> {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("id", id);
                          o.put("res", res);
                          if (proxy != null) proxy.postMessage(o.toString());
                      } catch (Exception ignored) {
                      }
                  });
              }

              private void sendEvent(final String event, final Boolean on) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("event", event);
                      if (on != null) o.put("on", on.booleanValue());
                      sendRaw(o);
                  } catch (Exception ignored) {
                  }
              }

              private void sendRaw(final JSONObject o) {
                  ui.post(() -> {
                      try {
                          if (proxy != null) {
                              proxy.postMessage(o.toString());
                          } else {
                              web.evaluateJavascript("window.postMessage(Object.assign({bt:'event'}," + o.toString() + "),'*')", null);
                          }
                      } catch (Exception ignored) {
                      }
                  });
              }

              private void applyState() {
                  if (playing && !audioOnly) {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  } else {
                      getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  }
                  try { setPictureInPictureParams(pipParams()); } catch (Exception ignored) { }
              }


              // ---------- Querformat = Vollbild wie ein Film ----------

              private boolean landFull;
              private long lastConfigMs;
              private android.view.OrientationEventListener orient;
              private boolean sawLand;
              private long portSince;
              private boolean suppressLand;   // nach „Vollbild beenden“ nicht von selbst wieder ins Querformat springen, bis das Handy einmal aufrecht war

              /** Zurückschwenken ins Hochformat beendet das Querformat-Vollbild sofort (auch wenn die Drehung gesperrt war). */
              private void startOrientWatch() {
                  if (orient == null) {
                      orient = new android.view.OrientationEventListener(this) {
                          @Override public void onOrientationChanged(int a) {
                              if (a == ORIENTATION_UNKNOWN) { portSince = 0; return; }
                              boolean land = (a >= 60 && a <= 120) || (a >= 240 && a <= 300);
                              boolean port = a <= 30 || a >= 330 || (a >= 150 && a <= 210);
                              if (port && suppressLand) suppressLand = false;
                              if (!landFull) { sawLand = false; portSince = 0; return; }
                              if (land) { sawLand = true; portSince = 0; return; }
                              if (port && sawLand) {
                                  long now = SystemClock.uptimeMillis();
                                  if (portSince == 0) portSince = now;
                                  else if (now - portSince > 350) {
                                      portSince = 0; sawLand = false;
                                      ui.post(() -> { if (landFull) leaveLandscape(); });
                                  }
                              } else portSince = 0;
                          }
                      };
                  }
                  try { if (orient.canDetectOrientation()) orient.enable(); } catch (Exception ignored) { }
              }

              private void stopOrientWatch() {
                  try { if (orient != null) orient.disable(); } catch (Exception ignored) { }
              }

              private void cutout(boolean full) {
                  if (Build.VERSION.SDK_INT < 28) return;
                  try {
                      WindowManager.LayoutParams wl = getWindow().getAttributes();
                      wl.layoutInDisplayCutoutMode = full
                              ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                              : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_DEFAULT;
                      getWindow().setAttributes(wl);
                  } catch (Exception ignored) { }
              }

              private void immersive(boolean on) {
                  cutout(on);
                  getWindow().getDecorView().setSystemUiVisibility(on
                          ? (View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION)
                          : View.SYSTEM_UI_FLAG_VISIBLE);
              }

              /** Vollbild-Knopf (Android-eigener oder der der Seite): Querformat-Vollbild an/aus. autoRotate = Android hat es beim Drehen selbst ausgelöst. */
              private void landscapeButton(boolean fromChrome) {
                  if (landFull) {
                      // Beim Drehen löst Android das Vollbild oft von selbst aus: das ist kein Knopfdruck.
                      if (!fromChrome || SystemClock.uptimeMillis() - lastConfigMs > 3000) leaveLandscape();
                      return;
                  }
                  if (fromChrome && suppressLand) return;   // gerade erst beendet, Android-Auslösung ignorieren
                  suppressLand = false;
                  try { setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE); } catch (Exception ignored) { }
                  if (getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE) {
                      applyLandscape(true, true);
                  }
                  ui.postDelayed(() -> {
                      if (!landFull && fullscreenView == null) {
                          try { setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED); } catch (Exception ignored) { }
                      }
                  }, 2500);
              }

              private void updateLandscape(boolean land) {
                  applyLandscape(land, false);
              }

              private void applyLandscape(boolean land, boolean force) {
                  if (fullscreenView != null) { immersive(true); return; }   // Android-Vollbild aktiv: Leisten bleiben weg
                  boolean loaded = vid != null && !vid.isEmpty();
                  boolean want = land && !suppressLand && loaded && (playing || !pageMini) && !audioOnly && !inPip && fullscreenView == null;
                  if (want == landFull && !force) return;
                  landFull = want;
                  if (want) { sawLand = false; portSince = 0; suppressLand = false; startOrientWatch(); }
                  immersive(want);
                  sendEvent("land", want);
                  relayout();
              }

              /** Nach jedem Drehen/Vollbild-Wechsel die Fenstergröße neu an die Seite geben (gegen falsch große Ansicht). */
              private void relayout() {
                  try { web.requestLayout(); } catch (Exception ignored) { }
                  ui.postDelayed(() -> { try { web.requestLayout(); } catch (Exception ignored) { } sendEvent("resize", null); }, 150);
                  ui.postDelayed(() -> { try { web.requestLayout(); } catch (Exception ignored) { } sendEvent("resize", null); }, 600);
              }

              private void leaveLandscape() {
                  landFull = false;
                  suppressLand = true;
                  startOrientWatch();
                  immersive(false);
                  sendEvent("land", false);
                  relayout();
                  try { setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT); } catch (Exception ignored) { }
                  ui.postDelayed(() -> {
                      try { setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED); } catch (Exception ignored) { }
                  }, 600);
              }

              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  lastConfigMs = SystemClock.uptimeMillis();
                  // Immer neu abgleichen (force): Auch wenn der Zustand gleich scheint, müssen Leisten und Seite zur Ausrichtung passen.
                  applyLandscape(newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE, true);
              }

              // ---------- Mini-Fenster (Bild-in-Bild) ----------

              private PictureInPictureParams pipParams() {
                  List<RemoteAction> actions = new ArrayList<>();
                  Intent i = new Intent(ACTION_TOGGLE).setPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getBroadcast(this, 1, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  String label = playing ? "Pause" : "Weiter";
                  actions.add(new RemoteAction(Icon.createWithResource(this, playing ? R.drawable.ic_pause : R.drawable.ic_play), label, label, pi));
                  Intent ai = new Intent(ACTION_AUDIO).setPackage(getPackageName());
                  PendingIntent api = PendingIntent.getBroadcast(this, 3, ai, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  actions.add(new RemoteAction(Icon.createWithResource(this, R.drawable.ic_headphones), "Nur Ton", "Nur Ton im Hintergrund", api));
                  PictureInPictureParams.Builder b = new PictureInPictureParams.Builder().setAspectRatio(new Rational(16, 9)).setActions(actions);
                  if (Build.VERSION.SDK_INT >= 31) {
                      // Android 12+: Mini-Fenster öffnet sich von selbst beim Verlassen der App, solange ein Video läuft.
                      try {
                          boolean auto = playing && !audioOnly && fullscreenView == null;
                          PictureInPictureParams.Builder.class.getMethod("setAutoEnterEnabled", boolean.class).invoke(b, auto);
                          PictureInPictureParams.Builder.class.getMethod("setSeamlessResizeEnabled", boolean.class).invoke(b, false);
                      } catch (Exception ignored) { }
                  }
                  return b.build();
              }

              private boolean pipAllowed() {
                  try {
                      android.app.AppOpsManager ao = (android.app.AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                      int mode = ao.checkOpNoThrow("android:picture_in_picture", android.os.Process.myUid(), getPackageName());
                      return mode != android.app.AppOpsManager.MODE_IGNORED && mode != android.app.AppOpsManager.MODE_ERRORED;
                  } catch (Exception e) {
                      return true;
                  }
              }

              private void openPipSettings() {
                  try {
                      Intent i = new Intent("android.settings.PICTURE_IN_PICTURE_SETTINGS", Uri.parse("package:" + getPackageName()));
                      startActivity(i);
                      return;
                  } catch (Exception ignored) { }
                  try {
                      startActivity(new Intent(android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName())));
                  } catch (Exception ignored) { }
              }

              private void enterPip(boolean announce) {
                  if (!getPackageManager().hasSystemFeature(PackageManager.FEATURE_PICTURE_IN_PICTURE)) {
                      if (announce) toast("Dieses Gerät unterstützt kein Mini-Fenster.");
                      return;
                  }
                  if (!pipAllowed()) {
                      if (announce) {
                          toast("Bild-im-Bild ist für BraveTube ausgeschaltet. Ich öffne die Einstellung: bitte einschalten und zurückkommen.");
                          openPipSettings();
                      }
                      return;
                  }
                  try {
                      boolean ok = enterPictureInPictureMode(pipParams());
                      if (!ok && announce) toast("Das Mini-Fenster ließ sich gerade nicht öffnen. Starte zuerst ein Video.");
                  } catch (Exception e) {
                      if (announce) {
                          toast("Mini-Fenster nicht möglich. Bitte in den Android-Einstellungen „Bild-im-Bild“ für BraveTube erlauben.");
                          openPipSettings();
                      }
                  }
              }

              @Override
              public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig);
                  inPip = isInPictureInPictureMode;
                  sendEvent("pip", isInPictureInPictureMode);
                  if (!isInPictureInPictureMode) updateLandscape(getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE);
              }

              @Override
              protected void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if (playing && !audioOnly && fullscreenView == null && !inPip) enterPip(false);
              }

              // ---------- Hintergrund ----------

              private final Runnable keepAlive = new Runnable() {
                  @Override
                  public void run() {
                      if (web == null || !playing) return;
                      // Die Seite soll auch bei verdecktem Fenster weiterlaufen (Ton und Video).
                      try { web.onResume(); web.resumeTimers(); } catch (Exception ignored) { }
                      ui.postDelayed(this, 1500);
                  }
              };

              private void startBackground() {
                  if (!playing) return;
                  try { startForegroundService(new Intent(this, MediaService.class)); } catch (Exception ignored) { }
                  ui.removeCallbacks(keepAlive);
                  ui.postDelayed(keepAlive, 300);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  startBackground();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  bgMode = true;
                  startBackground();
                  maybeNative();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  bgMode = false;
                  ui.removeCallbacks(keepAlive);
                  try { web.onResume(); } catch (Exception ignored) { }
                  if (MediaService.nativeActive()) {
                      // Der App-Player hat den Ton gespielt: Position und Zustand an die Seite zurückgeben.
                      int pos = MediaService.nativePosMs();
                      boolean wasPlaying = MediaService.nativeIsPlaying();
                      if (pos >= 0) {
                          try {
                              JSONObject o = new JSONObject();
                              o.put("event", "resume");
                              o.put("t", pos / 1000.0);
                              o.put("play", wasPlaying);
                              sendRaw(o);
                          } catch (Exception ignored) { }
                      }
                      nativeVid = "";
                  }
                  nativeBusy = false;
                  stopService(new Intent(this, MediaService.class));
                  if (!bgNote.isEmpty()) {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("event", "toast");
                          o.put("msg", bgNote);
                          sendRaw(o);
                      } catch (Exception ignored) { }
                      bgNote = "";
                  }
              }

              // ---------- Eigener Hintergrund-Ton ----------

              /** Holt schon während der Wiedergabe die Audio-Adresse, damit sie beim Sperren sofort bereitsteht. */
              private void prefetch(final String v) {
                  if (v == null || v.isEmpty() || v.equals(cachedVid) || v.equals(prefetching)) return;
                  prefetching = v;
                  nat.execute(() -> {
                      NativeAudio.Result r = NativeAudio.resolve(v);
                      ui.post(() -> {
                          cachedVid = v;
                          cachedRes = r;
                          if (v.equals(prefetching)) prefetching = "";
                      });
                  });
              }

              private void maybeNative() {
                  if (!bgMode || nativeBusy || vid.isEmpty() || !playing) return;
                  if (vid.equals(nativeVid) || vid.equals(failedVid)) return;
                  nativeBusy = true;
                  final String v = vid;
                  nat.execute(() -> {
                      NativeAudio.Result r = null;
                      if (v.equals(cachedVid) && cachedRes != null && !cachedRes.urls.isEmpty()) r = cachedRes;
                      if (r == null) r = NativeAudio.resolve(v);
                      final NativeAudio.Result res = r;
                      ui.post(() -> {
                          cachedVid = v;
                          cachedRes = res;
                          if (!bgMode) { nativeBusy = false; return; }
                          if (res.urls.isEmpty()) {
                              failedVid = v;
                              nativeBusy = false;
                              bgNote = "Hintergrund-Ton über die App war nicht möglich (" + res.error + "). Der Ton lief über die Seite.";
                              return;
                          }
                          web.evaluateJavascript("(function(){try{return player.getCurrentTime()}catch(e){return -1}})()", val -> {
                              double t = -1;
                              try { t = Double.parseDouble(val == null ? "-1" : val.trim()); } catch (Exception ignored) { }
                              if (t < 0) t = lastT;
                              if (t >= 0) lastT = t;
                              if (!bgMode) { nativeBusy = false; return; }
                              Intent si = new Intent(this, MediaService.class);
                              si.putExtra("capAt", SystemClock.elapsedRealtime());
                              si.putExtra("urls", res.urls.toArray(new String[0]));
                              si.putExtra("ua", res.ua);
                              si.putExtra("startMs", t > 0 ? (int) (t * 1000) : 0);
                              nativeVid = v;
                              try { startForegroundService(si); } catch (Exception e) {
                                  try { startService(si); } catch (Exception ignored) { }
                              }
                          });
                      });
                  });
              }

              private void onNativeResult(Intent intent) {
                  String a = intent.getAction();
                  if (a == null) return;
                  if (a.equals(MediaService.ACTION_NSTARTED)) {
                      nativeBusy = false;
                      if (!bgMode) return;
                      bgNote = "Der Ton lief im Hintergrund über den App-Player.";
                      // Der Ton kommt jetzt von der App: die Seite pausiert, damit nichts doppelt läuft.
                      sendEvent("pause", null);
                  } else if (a.equals(MediaService.ACTION_NFAILED)) {
                      nativeBusy = false;
                      failedVid = nativeVid;
                      nativeVid = "";
                      bgNote = "Hintergrund-Ton über die App war nicht möglich (" + intent.getStringExtra("msg") + ").";
                      if (bgMode) sendEvent("playagain", null);
                  } else if (a.equals(MediaService.ACTION_NDONE)) {
                      nativeVid = "";
                      nativeBusy = false;
                      if (bgMode) sendEvent("ended", null);
                  }
              }

              // ---------- YouTube-Links und „Teilen“ in BraveTube öffnen ----------

              private static final Pattern VID_URL = Pattern.compile("(?:[?&]v=|youtu\\.be/|/shorts/|/embed/|/live/)([A-Za-z0-9_-]{11})");

              static String videoIdFrom(String text) {
                  if (text == null) return null;
                  Matcher m = VID_URL.matcher(text);
                  return m.find() ? m.group(1) : null;
              }

              private void handleLinkIntent(Intent in) {
                  if (in == null) return;
                  String id = null;
                  try {
                      String a = in.getAction();
                      if (Intent.ACTION_VIEW.equals(a) && in.getData() != null) {
                          id = videoIdFrom(in.getData().toString());
                      } else if (Intent.ACTION_SEND.equals(a)) {
                          id = videoIdFrom(in.getStringExtra(Intent.EXTRA_TEXT));
                      }
                  } catch (Exception ignored) { }
                  if (id == null) return;
                  in.setAction(Intent.ACTION_MAIN);
                  in.setData(null);
                  pendingLink = id;
                  if (helloSeen) sendOpenVideo();
              }

              private void sendOpenVideo() {
                  if (pendingLink.isEmpty()) return;
                  try {
                      JSONObject o = new JSONObject();
                      o.put("event", "openvid");
                      o.put("id", pendingLink);
                      sendRaw(o);
                  } catch (Exception ignored) { }
                  pendingLink = "";
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleLinkIntent(intent);
              }

              // ---------- Sonstiges ----------

              private void openExternal(String url) {
                  if (url == null || !(url.startsWith("https://") || url.startsWith("http://"))) return;
                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(new Intent(i).setPackage("com.brave.browser"));
                      return;
                  } catch (Exception ignored) {
                  }
                  try {
                      startActivity(i);
                  } catch (Exception e) {
                      toast("Kein Browser gefunden.");
                  }
              }


              private void shareText(String title, String url) {
                  if (url == null || !(url.startsWith("https://") || url.startsWith("http://"))) return;
                  try {
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType("text/plain");
                      if (title != null && !title.isEmpty()) i.putExtra(Intent.EXTRA_SUBJECT, title);
                      i.putExtra(Intent.EXTRA_TEXT, (title == null || title.isEmpty() ? "" : title + "\n") + url);
                      startActivity(Intent.createChooser(i, "Teilen"));
                  } catch (Exception e) {
                      toast("Teilen war nicht möglich.");
                  }
              }

              private void toast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_LOGIN) {
                      CookieManager.getInstance().flush();
                      sendEvent("login", resultCode == RESULT_OK);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (landFull) {
                      leaveLandscape();
                      return;
                  }
                  if (fullscreenView != null) {
                      chrome.onHideCustomView();
                      return;
                  }
                  if (web.canGoBack()) {
                      web.goBack();
                  } else if (playing) {
                      moveTaskToBack(true);
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  try { unregisterReceiver(pipReceiver); } catch (Exception ignored) { }
                  try { unregisterReceiver(audioReceiver); } catch (Exception ignored) { }
                  try { unregisterReceiver(nativeReceiver); } catch (Exception ignored) { }
                  try { unregisterReceiver(screenReceiver); } catch (Exception ignored) { }
                  nat.shutdown();
                  stopService(new Intent(this, MediaService.class));
                  bg.shutdown();
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
